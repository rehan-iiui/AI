<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Simple Chat AI</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#f4f6fb;--panel:#fff;--panel2:#f8f9fd;--text:#182033;
--muted:#70798c;--border:#e2e6ef;--accent:#5b5cf0;--accent2:#8b5cf6;
--danger:#ef4444;--success:#16a34a;--shadow:0 15px 45px rgba(30,40,70,.1);
--bubble:#f0f2f7;
}
body.dark{
--bg:#090d17;--panel:#111827;--panel2:#182132;--text:#f5f7fb;
--muted:#9aa5b7;--border:#293548;--bubble:#1b2535;
--shadow:0 15px 45px rgba(0,0,0,.3);
}
body{
font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:var(--bg);color:var(--text);height:100vh;overflow:hidden
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.app{height:100vh;display:flex}
.sidebar{
width:285px;background:var(--panel);border-right:1px solid var(--border);
display:flex;flex-direction:column;padding:15px;flex-shrink:0;
transition:width .25s
}
.sidebar.collapsed{width:70px}
.sidebar.collapsed .hide-collapse{display:none}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:15px}
.logo{
width:42px;height:42px;border-radius:13px;display:grid;place-items:center;
background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:900
}
.brand h1{font-size:17px}.brand small{font-size:10px;color:var(--muted)}
.newchat{
width:100%;padding:11px;border:0;border-radius:11px;background:var(--accent);
color:#fff;font-weight:700;margin-bottom:11px
}
.search{position:relative;margin-bottom:10px}
.search input{
width:100%;padding:10px 10px 10px 34px;border:1px solid var(--border);
border-radius:10px;background:var(--panel2);color:var(--text);outline:0
}
.search span{position:absolute;left:11px;top:8px;color:var(--muted)}
.history-label{
font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:800;
margin:8px 4px
}
.history{flex:1;overflow:auto}
.history-item{
display:flex;align-items:center;gap:7px;padding:9px;border-radius:9px;
margin-bottom:3px
}
.history-item:hover,.history-item.active{background:var(--panel2)}
.history-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.star{color:#f59e0b}
.history-more{border:0;background:none;color:var(--muted);font-size:18px}
.side-bottom{border-top:1px solid var(--border);padding-top:9px}
.side-btn{
width:100%;padding:9px;border:0;background:none;color:var(--text);
text-align:left;border-radius:9px;margin:2px 0
}
.side-btn:hover{background:var(--panel2)}
.main{flex:1;display:flex;min-width:0}
.chat{flex:1;display:flex;flex-direction:column;min-width:0}
.top{
height:62px;border-bottom:1px solid var(--border);background:var(--panel);
display:flex;align-items:center;justify-content:space-between;padding:0 16px
}
.title{display:flex;align-items:center;gap:8px;min-width:0}
.title strong{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{
padding:4px 8px;border-radius:20px;background:var(--panel2);
border:1px solid var(--border);font-size:10px;color:var(--muted)
}
.top-actions{display:flex;gap:6px}
.icon{
width:35px;height:35px;border:1px solid var(--border);border-radius:9px;
background:var(--panel);color:var(--text)
}
.icon:hover{background:var(--panel2)}
.messages{flex:1;overflow:auto;padding:25px 6%}
.welcome{max-width:720px;margin:7vh auto;text-align:center}
.welcome-logo{
width:70px;height:70px;margin:auto;border-radius:22px;display:grid;place-items:center;
background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;font-size:28px;font-weight:900
}
.welcome h2{font-size:30px;margin-top:17px}.welcome p{color:var(--muted);margin-top:7px}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:23px}
.quick button{
padding:13px;border:1px solid var(--border);background:var(--panel);
color:var(--text);border-radius:11px;text-align:left
}
.quick button:hover{border-color:var(--accent)}
.message{display:flex;gap:10px;max-width:900px;margin:0 auto 20px}
.message.user{justify-content:flex-end}
.avatar{
width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;
font-size:10px;font-weight:800;flex-shrink:0
}
.message.user .avatar{order:2}
.msgbody{max-width:82%;min-width:0}
.message.user .msgbody{order:1}
.bubble{
padding:13px 15px;border-radius:15px;line-height:1.65;word-break:break-word
}
.message.assistant .bubble{background:var(--bubble);border:1px solid var(--border)}
.message.user .bubble{background:var(--accent);color:#fff;white-space:pre-wrap}
.bubble h1,.bubble h2,.bubble h3,.bubble h4{line-height:1.25;margin:14px 0 7px}
.bubble h1{font-size:25px}.bubble h2{font-size:21px}.bubble h3{font-size:18px}.bubble h4{font-size:16px}
.bubble p{margin:7px 0}.bubble ul,.bubble ol{margin:7px 0 7px 25px}
.bubble li{margin:3px 0}.bubble strong{font-weight:800}.bubble em{font-style:italic}
.bubble blockquote{border-left:4px solid var(--accent);padding-left:12px;color:var(--muted);margin:10px 0}
.bubble code{
background:rgba(120,120,120,.16);padding:2px 5px;border-radius:5px;
font-family:monospace
}
.bubble pre{
background:#111827;color:#fff;padding:13px;border-radius:10px;overflow:auto;margin:10px 0
}
.bubble pre code{background:none;padding:0}
.bubble table{border-collapse:collapse;width:100%;margin:10px 0}
.bubble th,.bubble td{border:1px solid var(--border);padding:7px;text-align:left}
.bubble th{background:var(--panel2)}
.bubble a{color:var(--accent);text-decoration:underline}
.bubble hr{border:0;border-top:1px solid var(--border);margin:13px 0}
.actions{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
.actions button{
border:0;background:none;color:var(--muted);font-size:10px;padding:4px 6px;border-radius:5px
}
.actions button:hover{background:var(--panel2);color:var(--text)}
.reaction.active{color:var(--accent)}
.typing{display:flex;gap:4px}.typing i{
width:7px;height:7px;background:var(--muted);border-radius:50%;animation:bounce 1s infinite
}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}}
.composer-wrap{background:var(--panel);border-top:1px solid var(--border);padding:9px 6% 14px}
.toolbar{max-width:900px;margin:auto;display:flex;gap:5px;overflow:auto;padding-bottom:6px}
.tool{
border:1px solid var(--border);background:var(--panel2);color:var(--text);
border-radius:7px;padding:5px 8px;font-size:10px;white-space:nowrap
}
.composer{
max-width:900px;margin:auto;border:1px solid var(--border);border-radius:15px;
background:var(--panel2);display:flex;align-items:flex-end;padding:7px;gap:7px
}
.composer textarea{
flex:1;min-height:43px;max-height:150px;resize:none;border:0;outline:0;
background:transparent;color:var(--text);padding:10px
}
.send{
width:43px;height:43px;border:0;border-radius:11px;background:var(--accent);color:white
}
.send.stop{background:var(--danger)}
.counter{max-width:900px;margin:auto;text-align:right;font-size:9px;color:var(--muted)}
.right{
width:320px;background:var(--panel);border-left:1px solid var(--border);
padding:15px;overflow:auto
}
.right h2{font-size:15px;margin-bottom:12px}
.card{
background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:11px;margin-bottom:10px
}
.card h3{font-size:11px;margin-bottom:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pbtn{
padding:8px;border:1px solid var(--border);background:var(--panel);color:var(--text);
border-radius:8px;font-size:10px
}
.pbtn.active{border-color:var(--accent);color:var(--accent)}
.stat{display:flex;justify-content:space-between;font-size:11px;padding:4px 0;color:var(--muted)}
.stat b{color:var(--text)}
.control{
width:100%;padding:8px;border:1px solid var(--border);border-radius:8px;
background:var(--panel);color:var(--text);margin-top:5px;text-align:left;font-size:11px
}
.modal-bg{
position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;
justify-content:center;padding:18px;z-index:100
}
.modal-bg.show{display:flex}
.modal{
width:min(620px,100%);max-height:90vh;overflow:auto;background:var(--panel);
border:1px solid var(--border);border-radius:17px;padding:18px;box-shadow:var(--shadow)
}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal-head h2{font-size:18px}
.close{border:0;background:none;color:var(--muted);font-size:22px}
.field{margin-bottom:12px}.field label{display:block;font-size:11px;font-weight:800;margin-bottom:5px}
.field input,.field textarea,.field select{
width:100%;padding:9px;border:1px solid var(--border);border-radius:9px;
background:var(--panel2);color:var(--text);outline:0
}
.field textarea{min-height:90px;resize:vertical}
.save{
width:100%;padding:10px;border:0;border-radius:9px;background:var(--accent);
color:#fff;font-weight:700
}
.menu{
display:grid;grid-template-columns:repeat(2,1fr);gap:6px
}
.menu button{
padding:9px;border:1px solid var(--border);border-radius:8px;
background:var(--panel2);color:var(--text);text-align:left;font-size:11px
}
.dropzone{
border:2px dashed var(--border);padding:25px;text-align:center;border-radius:12px;
color:var(--muted);margin-bottom:10px
}
.dropzone.drag{border-color:var(--accent);background:rgba(91,92,240,.08)}
.file-item{
display:flex;justify-content:space-between;padding:8px;border:1px solid var(--border);
border-radius:8px;margin-bottom:5px;font-size:11px
}
.toast{
position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);
background:#111827;color:#fff;padding:9px 15px;border-radius:9px;font-size:11px;
opacity:0;pointer-events:none;transition:.2s;z-index:200
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.overlay-menu{
position:fixed;z-index:150;background:var(--panel);border:1px solid var(--border);
box-shadow:var(--shadow);border-radius:10px;padding:5px;min-width:170px;display:none
}
.overlay-menu.show{display:block}
.overlay-menu button{
display:block;width:100%;border:0;background:none;color:var(--text);
padding:8px;text-align:left;border-radius:6px;font-size:11px
}
.overlay-menu button:hover{background:var(--panel2)}
.memory{
padding:8px;border:1px solid var(--border);border-radius:8px;margin-bottom:5px;font-size:11px
}
.selected{
outline:2px solid var(--accent);outline-offset:2px
}
body.compact .message{margin-bottom:9px}
body.compact .bubble{padding:8px 11px}
body.compact .messages{padding-top:15px}
body.noanimations *{transition:none!important;animation:none!important}
body.fullscreen .right{display:none}
body.fullscreen .sidebar{display:none}
@media(max-width:1050px){.right{display:none}}
@media(max-width:700px){
.sidebar{display:none}.messages,.composer-wrap{padding-left:10px;padding-right:10px}
.quick{grid-template-columns:1fr}.msgbody{max-width:88%}
.top{padding:0 9px}.welcome h2{font-size:24px}
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar" id="sidebar">

<div class="brand">
<div class="logo" id="appLogo">AI</div>
<div class="hide-collapse">
<h1>Simple Chat AI</h1>
<small>AI Workspace</small>
</div>
</div>

<button class="newchat" id="newChat">＋ New Chat</button>

<div class="search">
<span>⌕</span>
<input id="search" placeholder="Search chats...">
</div>

<div class="history-label hide-collapse">Chats</div>
<div class="history" id="history"></div>

<div class="side-bottom">
<button class="side-btn" id="collapseBtn">☰ <span class="hide-collapse">Collapse</span></button>
<button class="side-btn" id="settingsBtn">⚙ <span class="hide-collapse">Settings</span></button>
<button class="side-btn" id="themeBtn">◐ <span class="hide-collapse">Theme</span></button>
</div>

</aside>

<main class="main">

<section class="chat">

<header class="top">

<div class="title">
<strong id="chatTitle">New Chat</strong>
<span class="badge" id="personaBadge">Assistant</span>
</div>

<div class="top-actions">
<button class="icon" id="favoriteBtn" title="Favorite">☆</button>
<button class="icon" id="renameBtn" title="Rename">✎</button>
<button class="icon" id="archiveBtn" title="Archive">▣</button>
<button class="icon" id="fullscreenBtn" title="Fullscreen">⛶</button>
<button class="icon" id="moreBtn" title="More">⋯</button>
</div>

</header>

<div class="messages" id="messages">

<div class="welcome" id="welcome">

<div class="welcome-logo">AI</div>

<h2>What can I help you with?</h2>

<p>Your all-in-one AI workspace.</p>

<div class="quick">
<button data-prompt="Explain this topic clearly and simply.">💡 Explain something</button>
<button data-prompt="Give me creative ideas for a new project.">✨ Generate ideas</button>
<button data-prompt="Help me write something professional.">✍ Writing help</button>
<button data-prompt="Teach me something interesting step by step.">📚 Teach me</button>
</div>

</div>

</div>

<div class="composer-wrap">

<div class="toolbar">

<button class="tool" data-action="bold">B</button>
<button class="tool" data-action="italic">I</button>
<button class="tool" data-action="heading">H</button>
<button class="tool" data-action="bullet">• List</button>
<button class="tool" data-action="code">Code</button>
<button class="tool" data-action="quote">Quote</button>
<button class="tool" data-action="summarize">Summarize</button>
<button class="tool" data-action="translate">Translate</button>
<button class="tool" data-action="grammar">Grammar</button>
<button class="tool" id="attachBtn">📎 Files</button>

</div>

<div class="counter" id="counter">0 characters · 0 words</div>

<div class="composer">

<textarea id="input" placeholder="Message Simple Chat AI..." rows="1"></textarea>

<button class="send" id="send">➤</button>

</div>

</div>

</section>


<aside class="right">

<h2>AI Control Center</h2>

<div class="card">
<h3>AI Persona</h3>
<div class="grid2" id="personas">
<button class="pbtn active" data-persona="Assistant">🤖 Assistant</button>
<button class="pbtn" data-persona="Teacher">📚 Teacher</button>
<button class="pbtn" data-persona="Coder">💻 Coder</button>
<button class="pbtn" data-persona="Writer">✍ Writer</button>
<button class="pbtn" data-persona="Creative">🎨 Creative</button>
<button class="pbtn" data-persona="Business">💼 Business</button>
</div>
<button class="control" id="customPersona">＋ Custom Persona</button>
</div>

<div class="card">
<h3>Conversation</h3>
<div class="stat"><span>Messages</span><b id="statMessages">0</b></div>
<div class="stat"><span>Words</span><b id="statWords">0</b></div>
<div class="stat"><span>AI replies</span><b id="statAI">0</b></div>
<div class="stat"><span>Pinned</span><b id="statPinned">0</b></div>
</div>

<div class="card">
<h3>Response Mode</h3>
<div class="grid2">
<button class="pbtn active" data-mode="Balanced">Balanced</button>
<button class="pbtn" data-mode="Concise">Concise</button>
<button class="pbtn" data-mode="Detailed">Detailed</button>
<button class="pbtn" data-mode="Creative">Creative</button>
</div>
</div>

<div class="card">
<h3>AI Tools</h3>
<button class="control" id="promptLibrary">▤ Prompt Library</button>
<button class="control" id="memoryBtn">🧠 Conversation Memory</button>
<button class="control" id="compareBtn">⚖ Compare Responses</button>
<button class="control" id="variationsBtn">⑂ Response Variations</button>
<button class="control" id="conversationSettings">⚙ AI Settings</button>
</div>

<div class="card">
<h3>Workspace</h3>
<button class="control" id="foldersBtn">📁 Chat Folders</button>
<button class="control" id="filesBtn">📄 File Library</button>
<button class="control" id="backgroundBtn">🖼 Background</button>
<button class="control" id="appearanceBtn">🎨 Appearance</button>
</div>

</aside>

</main>
</div>


<!-- FILE INPUT -->

<input type="file" id="fileInput" hidden multiple accept=".txt,.md,.pdf">


<!-- GENERAL MODAL -->

<div class="modal-bg" id="modalBg">
<div class="modal" id="modal"></div>
</div>


<!-- CONTEXT MENU -->

<div class="overlay-menu" id="contextMenu"></div>


<div class="toast" id="toast"></div>


<script>
"use strict";

/* =========================================================
   STORAGE
========================================================= */

const CHAT_KEY="simple_chat_ai_48_chats";
const SETTING_KEY="simple_chat_ai_48_settings";
const FILE_KEY="simple_chat_ai_48_files";

let chats=[];
let files=[];
let currentId=null;
let generating=false;
let controller=null;
let selectedMessage=null;

let settings={
theme:"light",
accent:"#5b5cf0",
persona:"Assistant",
mode:"Balanced",
temperature:1,
maxTokens:2000,
systemPrompt:"",
density:"comfortable",
background:"default",
avatar:"AI",
customPersonas:[],
memory:[],
folders:[],
animations:true
};


/* =========================================================
   DOM
========================================================= */

const $=id=>document.getElementById(id);

const messages=$("messages");
const input=$("input");
const send=$("send");
const history=$("history");
const welcome=$("welcome");
const modalBg=$("modalBg");
const modal=$("modal");
const toast=$("toast");


/* =========================================================
   STORAGE
========================================================= */

function load(){
try{
chats=JSON.parse(localStorage.getItem(CHAT_KEY)||"[]");
if(!Array.isArray(chats))chats=[];
}catch{chats=[]}

try{
files=JSON.parse(localStorage.getItem(FILE_KEY)||"[]");
if(!Array.isArray(files))files=[];
}catch{files=[]}

try{
const s=JSON.parse(localStorage.getItem(SETTING_KEY)||"{}");
if(s&&typeof s==="object")settings={...settings,...s};
}catch{}

if(!chats.length)createChat(false);
else currentId=chats[0].id;

applySettings();
renderHistory();
renderChat();
}

function save(){
localStorage.setItem(CHAT_KEY,JSON.stringify(chats));
localStorage.setItem(FILE_KEY,JSON.stringify(files));
localStorage.setItem(SETTING_KEY,JSON.stringify(settings));
}

function current(){
return chats.find(c=>c.id===currentId);
}


/* =========================================================
   CHAT CREATION
========================================================= */

function createChat(render=true){
const chat={
id:Date.now().toString()+Math.random().toString(36).slice(2),
name:"New Chat",
messages:[],
favorite:false,
archived:false,
folder:"",
created:Date.now()
};
chats.unshift(chat);
currentId=chat.id;
save();
if(render){
renderHistory();
renderChat();
}
}


/* =========================================================
   HISTORY
========================================================= */

function renderHistory(){
const q=$("search").value.trim().toLowerCase();
history.innerHTML="";

chats
.filter(c=>!c.archived)
.filter(c=>!q||c.name.toLowerCase().includes(q))
.forEach(chat=>{
const row=document.createElement("div");
row.className="history-item"+(chat.id===currentId?" active":"");

if(chat.favorite){
const star=document.createElement("span");
star.className="star";
star.textContent="★";
row.appendChild(star);
}

const name=document.createElement("div");
name.className="history-name";
name.textContent=chat.name;

const more=document.createElement("button");
more.className="history-more";
more.textContent="⋯";

more.onclick=e=>{
e.stopPropagation();
openChatMenu(chat,e.clientX,e.clientY);
};

row.append(name,more);

row.onclick=()=>{
currentId=chat.id;
renderHistory();
renderChat();
};

history.appendChild(row);
});
}

function openChatMenu(chat,x,y){
const menu=$("contextMenu");
menu.innerHTML="";

const options=[
["Rename",()=>renameChat(chat)],
["Duplicate",()=>duplicateChat(chat)],
["Favorite",()=>toggleFavorite(chat)],
["Archive",()=>archiveChat(chat)],
["Move to folder",()=>moveFolder(chat)],
["Delete",()=>deleteChat(chat)]
];

options.forEach(([text,fn])=>{
const b=document.createElement("button");
b.textContent=text;
b.onclick=()=>{
menu.classList.remove("show");
fn();
};
menu.appendChild(b);
});

menu.style.left=Math.min(x,window.innerWidth-190)+"px";
menu.style.top=Math.min(y,window.innerHeight-250)+"px";
menu.classList.add("show");
}


/* =========================================================
   CHAT RENDER
========================================================= */

function renderChat(){
const chat=current();
if(!chat)return;

$("chatTitle").textContent=chat.name;
$("personaBadge").textContent=settings.persona;
$("favoriteBtn").textContent=chat.favorite?"★":"☆";

messages.innerHTML="";

if(!chat.messages.length){
messages.appendChild(welcome);
welcome.style.display="block";
}else{
welcome.style.display="none";
chat.messages.forEach((m,i)=>addMessage(m,i));
}

updateStats();
messages.scrollTop=messages.scrollHeight;
}

function addMessage(m,index){
const row=document.createElement("div");
row.className="message "+m.role;

const avatar=document.createElement("div");
avatar.className="avatar";
avatar.textContent=m.role==="user"?"You":settings.avatar;

const body=document.createElement("div");
body.className="msgbody";

const bubble=document.createElement("div");
bubble.className="bubble";

if(m.role==="assistant"){
bubble.innerHTML=markdown(m.content);
}else{
bubble.textContent=m.content;
}

body.appendChild(bubble);

const actions=document.createElement("div");
actions.className="actions";

if(m.role==="assistant"){
addAction(actions,"Copy",()=>copy(m.content));
addAction(actions,"↻ Regenerate",()=>regenerate(index));
addAction(actions,"✦ Improve",()=>improve(index));
addAction(actions,"▣ Summarize",()=>runAction("Summarize",m.content));
addAction(actions,"📌 "+(m.pinned?"Unpin":"Pin"),()=>pinMessage(index));
addAction(actions,"👍",()=>reaction(m,"up"));
addAction(actions,"👎",()=>reaction(m,"down"));
}else{
addAction(actions,"Edit",()=>editMessage(index));
addAction(actions,"Copy",()=>copy(m.content));
}

if(m.reaction){
const r=document.createElement("span");
r.textContent=m.reaction==="up"?" 👍":" 👎";
r.style.fontSize="10px";
actions.appendChild(r);
}

body.appendChild(actions);
row.append(avatar,body);

if(m.pinned)row.classList.add("selected");

messages.appendChild(row);
}

function addAction(parent,text,fn){
const b=document.createElement("button");
b.textContent=text;
b.onclick=fn;
parent.appendChild(b);
}


/* =========================================================
   SIMPLE MARKDOWN ENGINE
========================================================= */

function escape(s){
const d=document.createElement("div");
d.textContent=s;
return d.innerHTML;
}

function inlineMD(s){
s=escape(s);

s=s.replace(/`([^`]+)`/g,"<code>$1</code>");
s=s.replace(/\*\*([\s\S]+?)\*\*/g,"<strong>$1</strong>");
s=s.replace(/__([\s\S]+?)__/g,"<strong>$1</strong>");
s=s.replace(/\*([^*]+)\*/g,"<em>$1</em>");
s=s.replace(/_([^_]+)_/g,"<em>$1</em>");
s=s.replace(/~~(.+?)~~/g,"<del>$1</del>");
s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
'<a href="$2" target="_blank" rel="noopener">$1</a>');

return s;
}

function markdown(text){
const lines=text.replace(/\r/g,"").split("\n");
let out="";
let inCode=false;
let code="";
let listType="";
let table=false;

for(let i=0;i<lines.length;i++){
let line=lines[i];

if(line.startsWith("```")){
if(!inCode){
inCode=true;
code="";
}else{
out+="<pre><code>"+escape(code)+"</code></pre>";
inCode=false;
}
continue;
}

if(inCode){
code+=line+"\n";
continue;
}

if(/^---+$/.test(line.trim())){
out+="<hr>";
continue;
}

if(/^\s*\|/.test(line)&&i+1<lines.length&&/^\s*\|?\s*:?-+:?/.test(lines[i+1])){
let headers=line.split("|").slice(1,-1);
let separator=lines[i+1];
if(separator.includes("---")){
out+="<table><thead><tr>";
headers.forEach(h=>out+="<th>"+inlineMD(h.trim())+"</th>");
out+="</tr></thead><tbody>";
i++;
table=true;
continue;
}
}

if(table&&/^\s*\|/.test(line)){
let cells=line.split("|").slice(1,-1);
out+="<tr>";
cells.forEach(c=>out+="<td>"+inlineMD(c.trim())+"</td>");
out+="</tr>";
continue;
}else if(table){
out+="</tbody></table>";
table=false;
}

let h=line.match(/^(#{1,6})\s+(.+)$/);
if(h){
out+="<h"+h[1].length+">"+inlineMD(h[2])+"</h"+h[1].length+">";
continue;
}

let quote=line.match(/^>\s?(.*)$/);
if(quote){
out+="<blockquote>"+inlineMD(quote[1])+"</blockquote>";
continue;
}

let bullet=line.match(/^\s*[-*+]\s+(.+)$/);
if(bullet){
if(listType!=="ul"){
if(listType)out+="</ol>";
out+="<ul>";
listType="ul";
}
out+="<li>"+inlineMD(bullet[1])+"</li>";
continue;
}

let ordered=line.match(/^\s*\d+\.\s+(.+)$/);
if(ordered){
if(listType!=="ol"){
if(listType)out+="</ul>";
out+="<ol>";
listType="ol";
}
out+="<li>"+inlineMD(ordered[1])+"</li>";
continue;
}

if(listType){
out+=listType==="ul"?"</ul>":"</ol>";
listType="";
}

if(line.trim()===""){
continue;
}

out+="<p>"+inlineMD(line)+"</p>";
}

if(listType)out+=listType==="ul"?"</ul>":"</ol>";
if(table)out+="</tbody></table>";

return out;
}


/* =========================================================
   SEND
========================================================= */

async function sendMessage(){
if(generating){
stopGeneration();
return;
}

const text=input.value.trim();
if(!text)return;

const chat=current();
if(!chat)return;

chat.messages.push({
role:"user",
content:text,
time:Date.now()
});

if(chat.messages.filter(m=>m.role==="user").length===1){
chat.name=text.length>40?text.slice(0,40)+"...":text;
}

input.value="";
resizeInput();
save();
renderHistory();
renderChat();

await generate(text);
}

async function generate(userText,extraPrompt=""){
if(generating)return;

const chat=current();
if(!chat)return;

generating=true;
controller=new AbortController();

send.classList.add("stop");
send.textContent="■";

showTyping();

try{
const historyData=chat.messages.slice(0,-1).map(m=>({
role:m.role,
content:m.content
}));

const personaPrompts={
Assistant:"Be a helpful general AI assistant.",
Teacher:"Teach clearly, step by step, using understandable examples.",
Coder:"Act as an expert programming assistant. Provide complete, correct practical code when requested.",
Writer:"Act as a skilled natural writer. Produce polished writing.",
Creative:"Be creative and generate original useful ideas.",
Business:"Act as a practical business assistant."
};

let system=
personaPrompts[settings.persona]||
personaPrompts.Assistant;

if(settings.mode==="Concise")
system+=" Keep responses concise.";
if(settings.mode==="Detailed")
system+=" Give detailed explanations.";
if(settings.mode==="Creative")
system+=" Prefer creative and varied approaches.";

if(settings.systemPrompt)
system+="\n"+settings.systemPrompt;

if(extraPrompt)
system+="\n"+extraPrompt;

const response=await fetch("/.netlify/functions/chat",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
message:userText,
history:historyData,
systemPrompt:system,
temperature:Number(settings.temperature),
maxTokens:Number(settings.maxTokens)
}),
signal:controller.signal
});

const data=await response.json();

if(!response.ok){
throw new Error(data.error||"The AI request failed.");
}

if(!data.reply){
throw new Error("The AI returned no response.");
}

removeTyping();

chat.messages.push({
role:"assistant",
content:data.reply,
time:Date.now(),
pinned:false,
reaction:""
});

save();
renderChat();

}catch(err){
removeTyping();

if(err.name!=="AbortError"){
chat.messages.push({
role:"assistant",
content:"**Error:** "+err.message
});
save();
renderChat();
}
}finally{
generating=false;
controller=null;
send.classList.remove("stop");
send.textContent="➤";
}
}

function stopGeneration(){
if(controller)controller.abort();
removeTyping();
generating=false;
send.classList.remove("stop");
send.textContent="➤";
}

async function regenerate(index){
const chat=current();
if(!chat||generating)return;

const assistant=chat.messages[index];

const user=chat.messages[index-1];
if(!user||user.role!=="user")return;

chat.messages.splice(index,1);
save();
renderChat();

await generate(user.content);
}

function wrapSelection(before,after){
const start=input.selectionStart;
const end=input.selectionEnd;
const selected=input.value.slice(start,end);

input.value=
input.value.slice(0,start)+
before+
(selected||"text")+
after+
input.value.slice(end);

input.focus();
input.setSelectionRange(start+before.length,start+before.length+(selected||"text").length);
}

/* =========================================================
   ARCHIVE
========================================================= */

function archiveChat(chat=current()){
if(!chat)return;

chat.archived=true;

if(chat.id===currentId){
const next=chats.find(c=>!c.archived&&c.id!==chat.id);
if(next)currentId=next.id;
else createChat(false);
}

save();
renderHistory();
renderChat();
toastMsg("Chat archived");
}


/* =========================================================
   DELETE
========================================================= */

function deleteChat(chat){
if(!confirm("Delete this chat permanently?"))return;

chats=chats.filter(c=>c.id!==chat.id);

if(!chats.length){
createChat(false);
}else if(currentId===chat.id){
currentId=chats[0].id;
}

save();
renderHistory();
renderChat();
toastMsg("Chat deleted");
}

copyChat.id=Date.now().toString()+Math.random();

copyChat.created=Date.now();

chats.unshift(copyChat);
currentId=copyChat.id;

save();
renderHistory();
renderChat();
toastMsg("Chat duplicated");
}

function handleFiles(list){
[...list].forEach(file=>{
if(file.name.toLowerCase().endsWith(".txt")||
file.name.toLowerCase().endsWith(".md")){
const reader=new FileReader();

reader.onload=()=>{
files.push({
name:file.name,
size:file.size,
type:file.type,
content:reader.result
});

save();
toastMsg(file.name+" added");
};

reader.readAsText(file);
}else if(file.name.toLowerCase().endsWith(".pdf")){
files.push({
name:file.name,
size:file.size,
type:"application/pdf",
content:"PDF file stored. Browser PDF text extraction can be connected through a PDF parser."
});
save();
toastMsg(file.name+" added");
}else{
toastMsg("Unsupported file: "+file.name);
}
});
}

</div>

`);

dz.ondragover=e=>{
e.preventDefault();
dz.classList.add("drag");
};

dz.ondragleave=()=>{
dz.classList.remove("drag");
};

dz.ondrop=e=>{
e.preventDefault();
dz.classList.remove("drag");
handleFiles(e.dataTransfer.files);
renderFiles();
};
}

});
}

window.deleteFile=i=>{
files.splice(i,1);
save();
renderFiles();

/* =========================================================
   EXPORTS
========================================================= */

function exportMarkdown(){
const chat=current();
if(!chat)return;

const text="# "+chat.name+"\n\n"+
chat.messages.map(m=>
"## "+(m.role==="user"?"You":"AI")+"\n\n"+m.content
).join("\n\n");

download(chat.name+".md",text,"text/markdown");
toastMsg("Markdown exported");
}

function exportHTML(){
const chat=current();
if(!chat)return;

const html=`
<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>${escape(chat.name)}</title></head>
<body>
<h1>${escape(chat.name)}</h1>
${chat.messages.map(m=>`
<section>
<h2>${m.role==="user"?"You":"AI"}</h2>
<div>${m.role==="assistant"?markdown(m.content):escape(m.content).replace(/\n/g,"<br>")}</div>
</section>
`).join("")}
</body>
</html>`;

download(chat.name+".html",html,"text/html");
toastMsg("HTML exported");
}

function download(name,text,type){
const blob=new Blob([text],{type});
const url=URL.createObjectURL(blob);
const a=document.createElement("a");
a.href=url;
a.download=name.replace(/[<>:"/\\|?*]/g,"_");
a.click();
URL.revokeObjectURL(url);
}

function printChat(){
const chat=current();
if(!chat)return;

const win=window.open("","_blank");
if(!win){
toastMsg("Allow popups to print");
return;
}

win.document.write(`
<!DOCTYPE html>
<html>
<head><title>${escape(chat.name)}</title></head>
<body>
<h1>${escape(chat.name)}</h1>
${chat.messages.map(m=>`
<h3>${m.role==="user"?"You":"AI"}</h3>
<div>${m.role==="assistant"?markdown(m.content):escape(m.content).replace(/\n/g,"<br>")}</div>
<hr>
`).join("")}
</body>
</html>
`);

win.document.close();
win.print();
}

/* =========================================================
   BRANCH
========================================================= */

function branchChat(){
const chat=current();
if(!chat)return;

const branch=JSON.parse(JSON.stringify(chat));

branch.id=Date.now().toString()+Math.random();
branch.name=chat.name+" — Branch";
branch.created=Date.now();

chats.unshift(branch);
currentId=branch.id;

save();
renderHistory();
renderChat();
toastMsg("Conversation branched");
}


/* =========================================================
   CLEAR
========================================================= */

function clearConversation(){
const chat=current();
if(!chat)return;

if(!confirm("Clear this conversation?"))return;

chat.messages=[];
save();
renderChat();
toastMsg("Conversation cleared");
}

/* =========================================================
   INPUT
========================================================= */

input.addEventListener("input",()=>{

updateCounter();
});

input.addEventListener("keydown",e=>{
if(e.key==="Enter"&&!e.shiftKey){
e.preventDefault();
sendMessage();
}
});

send.onclick=sendMessage;

function resizeInput(){
input.style.height="auto";
input.style.height=Math.min(input.scrollHeight,150)+"px";
}

function updateCounter(){
const text=input.value;
const words=text.trim()?text.trim().split(/\s+/).length:0;
$("counter").textContent=text.length+" characters · "+words+" words";
}


/* =========================================================
   STATS
========================================================= */

function updateStats(){
const chat=current();
if(!chat)return;

const users=chat.messages.filter(m=>m.role==="user");
const ai=chat.messages.filter(m=>m.role==="assistant");
const pinned=chat.messages.filter(m=>m.pinned);

const words=users.map(m=>m.content).join(" ").trim();
const count=words?words.split(/\s+/).length:0;

$("statMessages").textContent=chat.messages.length;
$("statWords").textContent=count;
$("statAI").textContent=ai.length;
$("statPinned").textContent=pinned.length;
}


/* =========================================================
   MODAL
========================================================= */

function openModal(html){
modal.innerHTML=html;
modalBg.classList.add("show");
}

modalBg.classList.remove("show");
modal.innerHTML="";
}

modalBg.onclick=e=>{

};

$("contextMenu").onclick=e=>e.stopPropagation();

document.addEventListener("click",e=>{
if(!e.target.closest(".history-more")){
$("contextMenu").classList.remove("show");
}
});


/* =========================================================
   TOAST
========================================================= */

let toastTimer;

function toastMsg(text){
toast.textContent=text;
toast.classList.add("show");
clearTimeout(toastTimer);
toastTimer=setTimeout(()=>toast.classList.remove("show"),2200);
}


/* =========================================================
   KEYBOARD SHORTCUTS
========================================================= */

document.addEventListener("keydown",e=>{

if((e.ctrlKey||e.metaKey)&&e.key==="k"){
e.preventDefault();
$("search").focus();
}

if((e.ctrlKey||e.metaKey)&&e.key==="n"){
e.preventDefault();
createChat();
}

if((e.ctrlKey||e.metaKey)&&e.key==="e"){
e.preventDefault();
exportMarkdown();
}

if(e.key==="Escape"){
closeModal();
$("contextMenu").classList.remove("show");
}

});


/* =========================================================
   FILE DRAG/DROP OVER APP
========================================================= */

document.addEventListener("dragover",e=>{
if(e.dataTransfer&&e.dataTransfer.types.includes("Files")){
e.preventDefault();
}
});

document.addEventListener("drop",e=>{
if(e.dataTransfer&&e.dataTransfer.files.length){
e.preventDefault();
handleFiles(e.dataTransfer.files);
toastMsg("Files added");
}
});

load();
