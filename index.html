<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<title>Simple Chat AI</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#f4f6fb;
  --panel:#ffffff;
  --panel2:#f8f9fd;
  --text:#182033;
  --muted:#70798c;
  --border:#e2e6ef;
  --accent:#5b5cf0;
  --accent2:#8b5cf6;
  --danger:#ef4444;
  --success:#16a34a;
  --warning:#f59e0b;
  --bubble:#f0f2f7;
  --shadow:0 15px 45px rgba(30,40,70,.10);
}

body.dark{
  --bg:#090d17;
  --panel:#111827;
  --panel2:#182132;
  --text:#f5f7fb;
  --muted:#9aa5b7;
  --border:#293548;
  --bubble:#1b2535;
  --shadow:0 15px 45px rgba(0,0,0,.35);
}

body{
  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:var(--bg);
  color:var(--text);
  height:100vh;
  overflow:hidden;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

button:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.app{
  height:100vh;
  display:flex;
}

/* SIDEBAR */

.sidebar{
  width:285px;
  background:var(--panel);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  padding:15px;
  flex-shrink:0;
  transition:.25s;
}

.sidebar.collapsed{
  width:70px;
}

.sidebar.collapsed .hide-collapse{
  display:none;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
}

.logo{
  width:42px;
  height:42px;
  border-radius:13px;
  display:grid;
  place-items:center;
  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );
  color:#fff;
  font-weight:900;
}

.brand h1{
  font-size:17px;
}

.brand small{
  font-size:10px;
  color:var(--muted);
}

.newchat{
  width:100%;
  padding:11px;
  border:0;
  border-radius:11px;
  background:var(--accent);
  color:#fff;
  font-weight:700;
  margin-bottom:11px;
}

.search{
  position:relative;
  margin-bottom:10px;
}

.search input{
  width:100%;
  padding:10px 10px 10px 34px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--panel2);
  color:var(--text);
  outline:0;
}

.search span{
  position:absolute;
  left:11px;
  top:8px;
  color:var(--muted);
}

.history-label{
  font-size:10px;
  text-transform:uppercase;
  color:var(--muted);
  font-weight:800;
  margin:8px 4px;
}

.history{
  flex:1;
  overflow:auto;
}

.history-item{
  display:flex;
  align-items:center;
  gap:7px;
  padding:9px;
  border-radius:9px;
  margin-bottom:3px;
}

.history-item:hover,
.history-item.active{
  background:var(--panel2);
}

.history-name{
  flex:1;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-size:12px;
}

.star{
  color:#f59e0b;
}

.history-more{
  border:0;
  background:none;
  color:var(--muted);
  font-size:18px;
}

.side-bottom{
  border-top:1px solid var(--border);
  padding-top:9px;
}

.side-btn{
  width:100%;
  padding:9px;
  border:0;
  background:none;
  color:var(--text);
  text-align:left;
  border-radius:9px;
  margin:2px 0;
}

.side-btn:hover{
  background:var(--panel2);
}

/* MAIN */

.main{
  flex:1;
  display:flex;
  min-width:0;
}

.chat{
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0;
}

.top{
  height:62px;
  border-bottom:1px solid var(--border);
  background:var(--panel);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
}

.title{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
}

.title strong{
  font-size:14px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.badge{
  padding:4px 8px;
  border-radius:20px;
  background:var(--panel2);
  border:1px solid var(--border);
  font-size:10px;
  color:var(--muted);
}

.privacy-badge{
  display:none;
  padding:4px 8px;
  border-radius:20px;
  background:#fff3cd;
  color:#92400e;
  font-size:9px;
  font-weight:800;
}

.privacy-badge.show{
  display:inline-block;
}

.top-actions{
  display:flex;
  gap:6px;
}

.icon{
  width:35px;
  height:35px;
  border:1px solid var(--border);
  border-radius:9px;
  background:var(--panel);
  color:var(--text);
}

.icon:hover{
  background:var(--panel2);
}

/* MESSAGES */

.messages{
  flex:1;
  overflow:auto;
  padding:25px 6%;
}

.welcome{
  max-width:720px;
  margin:7vh auto;
  text-align:center;
}

.welcome-logo{
  width:70px;
  height:70px;
  margin:auto;
  border-radius:22px;
  display:grid;
  place-items:center;
  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );
  color:white;
  font-size:28px;
  font-weight:900;
}

.welcome h2{
  font-size:30px;
  margin-top:17px;
}

.welcome p{
  color:var(--muted);
  margin-top:7px;
}

.quick{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
  margin-top:23px;
}

.quick button{
  padding:13px;
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--text);
  border-radius:11px;
  text-align:left;
}

.quick button:hover{
  border-color:var(--accent);
}

.message{
  display:flex;
  gap:10px;
  max-width:900px;
  margin:0 auto 20px;
}

.message.user{
  justify-content:flex-end;
}

.avatar{
  width:34px;
  height:34px;
  border-radius:10px;
  display:grid;
  place-items:center;
  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );
  color:white;
  font-size:10px;
  font-weight:800;
  flex-shrink:0;
}

.message.user .avatar{
  order:2;
}

.msgbody{
  max-width:82%;
  min-width:0;
}

.message.user .msgbody{
  order:1;
}

.bubble{
  padding:13px 15px;
  border-radius:15px;
  line-height:1.65;
  word-break:break-word;
}

.message.assistant .bubble{
  background:var(--bubble);
  border:1px solid var(--border);
}

.message.user .bubble{
  background:var(--accent);
  color:#fff;
  white-space:pre-wrap;
}

.bubble h1,
.bubble h2,
.bubble h3,
.bubble h4{
  line-height:1.25;
  margin:14px 0 7px;
}

.bubble h1{
  font-size:25px;
}

.bubble h2{
  font-size:21px;
}

.bubble h3{
  font-size:18px;
}

.bubble h4{
  font-size:16px;
}

.bubble p{
  margin:7px 0;
}

.bubble ul,
.bubble ol{
  margin:7px 0 7px 25px;
}

.bubble li{
  margin:3px 0;
}

.bubble blockquote{
  border-left:4px solid var(--accent);
  padding-left:12px;
  color:var(--muted);
  margin:10px 0;
}

.bubble code{
  background:rgba(120,120,120,.16);
  padding:2px 5px;
  border-radius:5px;
  font-family:monospace;
}

.bubble pre{
  background:#111827;
  color:#fff;
  padding:13px;
  border-radius:10px;
  overflow:auto;
  margin:10px 0;
}

.bubble pre code{
  background:none;
  padding:0;
}

.bubble table{
  border-collapse:collapse;
  width:100%;
  margin:10px 0;
}

.bubble th,
.bubble td{
  border:1px solid var(--border);
  padding:7px;
  text-align:left;
}

.bubble th{
  background:var(--panel2);
}

.bubble a{
  color:var(--accent);
  text-decoration:underline;
}

.bubble hr{
  border:0;
  border-top:1px solid var(--border);
  margin:13px 0;
}

.bubble img{
  max-width:100%;
  border-radius:10px;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:3px;
  margin-top:5px;
}

.actions button{
  border:0;
  background:none;
  color:var(--muted);
  font-size:10px;
  padding:4px 6px;
  border-radius:5px;
}

.actions button:hover{
  background:var(--panel2);
  color:var(--text);
}

.selected{
  outline:2px solid var(--accent);
  outline-offset:2px;
}

.attachment-preview{
  margin-top:7px;
  font-size:10px;
  color:var(--muted);
}

.typing{
  display:flex;
  gap:4px;
}

.typing i{
  width:7px;
  height:7px;
  background:var(--muted);
  border-radius:50%;
  animation:bounce 1s infinite;
}

.typing i:nth-child(2){
  animation-delay:.15s;
}

.typing i:nth-child(3){
  animation-delay:.3s;
}

@keyframes bounce{
  0%,80%,100%{
    transform:translateY(0);
  }

  40%{
    transform:translateY(-5px);
  }
}

/* COMPOSER */

.composer-wrap{
  background:var(--panel);
  border-top:1px solid var(--border);
  padding:9px 6% 14px;
}

.toolbar{
  max-width:900px;
  margin:auto;
  display:flex;
  gap:5px;
  overflow:auto;
  padding-bottom:6px;
}

.tool{
  border:1px solid var(--border);
  background:var(--panel2);
  color:var(--text);
  border-radius:7px;
  padding:5px 8px;
  font-size:10px;
  white-space:nowrap;
}

.tool:hover{
  border-color:var(--accent);
}

.composer{
  max-width:900px;
  margin:auto;
  border:1px solid var(--border);
  border-radius:15px;
  background:var(--panel2);
  display:flex;
  align-items:flex-end;
  padding:7px;
  gap:7px;
}

.composer textarea{
  flex:1;
  min-height:43px;
  max-height:150px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  padding:10px;
}

.send{
  width:43px;
  height:43px;
  border:0;
  border-radius:11px;
  background:var(--accent);
  color:white;
}

.send.stop{
  background:var(--danger);
}

.counter{
  max-width:900px;
  margin:auto;
  text-align:right;
  font-size:9px;
  color:var(--muted);
}

/* RIGHT PANEL */

.right{
  width:320px;
  background:var(--panel);
  border-left:1px solid var(--border);
  padding:15px;
  overflow:auto;
}

.right h2{
  font-size:15px;
  margin-bottom:12px;
}

.card{
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:12px;
  padding:11px;
  margin-bottom:10px;
}

.card h3{
  font-size:11px;
  margin-bottom:8px;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}

.pbtn{
  padding:8px;
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--text);
  border-radius:8px;
  font-size:10px;
}

.pbtn.active{
  border-color:var(--accent);
  color:var(--accent);
}

.stat{
  display:flex;
  justify-content:space-between;
  font-size:11px;
  padding:4px 0;
  color:var(--muted);
}

.stat b{
  color:var(--text);
}

.control{
  width:100%;
  padding:8px;
  border:1px solid var(--border);
  border-radius:8px;
  background:var(--panel);
  color:var(--text);
  margin-top:5px;
  text-align:left;
  font-size:11px;
}

.control:hover{
  border-color:var(--accent);
}

/* MODALS */

.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  z-index:100;
}

.modal-bg.show{
  display:flex;
}

.modal{
  width:min(700px,100%);
  max-height:90vh;
  overflow:auto;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:17px;
  padding:18px;
  box-shadow:var(--shadow);
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

.modal-head h2{
  font-size:18px;
}

.close{
  border:0;
  background:none;
  color:var(--muted);
  font-size:22px;
}

.field{
  margin-bottom:12px;
}

.field label{
  display:block;
  font-size:11px;
  font-weight:800;
  margin-bottom:5px;
}

.field input,
.field textarea,
.field select{
  width:100%;
  padding:9px;
  border:1px solid var(--border);
  border-radius:9px;
  background:var(--panel2);
  color:var(--text);
  outline:0;
}

.field textarea{
  min-height:90px;
  resize:vertical;
}

.save{
  width:100%;
  padding:10px;
  border:0;
  border-radius:9px;
  background:var(--accent);
  color:#fff;
  font-weight:700;
}

.menu{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:6px;
}

.menu button{
  padding:9px;
  border:1px solid var(--border);
  border-radius:8px;
  background:var(--panel2);
  color:var(--text);
  text-align:left;
  font-size:11px;
}

.menu button:hover{
  border-color:var(--accent);
}

.dropzone{
  border:2px dashed var(--border);
  padding:25px;
  text-align:center;
  border-radius:12px;
  color:var(--muted);
  margin-bottom:10px;
}

.dropzone.drag{
  border-color:var(--accent);
  background:rgba(91,92,240,.08);
}

.file-item{
  display:flex;
  justify-content:space-between;
  padding:8px;
  border:1px solid var(--border);
  border-radius:8px;
  margin-bottom:5px;
  font-size:11px;
}

.file-use{
  border:0;
  background:none;
  color:var(--accent);
  font-size:10px;
}

.memory{
  padding:8px;
  border:1px solid var(--border);
  border-radius:8px;
  margin-bottom:5px;
  font-size:11px;
}

.result-card{
  border:1px solid var(--border);
  background:var(--panel2);
  border-radius:10px;
  padding:10px;
  margin-top:8px;
}

.chip-row{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:8px;
}

.chip{
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--text);
  border-radius:20px;
  padding:7px 10px;
  font-size:10px;
}

.chip:hover{
  border-color:var(--accent);
  color:var(--accent);
}

/* CONTEXT MENU */

.overlay-menu{
  position:fixed;
  z-index:150;
  background:var(--panel);
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  border-radius:10px;
  padding:5px;
  min-width:170px;
  display:none;
}

.overlay-menu.show{
  display:block;
}

.overlay-menu button{
  display:block;
  width:100%;
  border:0;
  background:none;
  color:var(--text);
  padding:8px;
  text-align:left;
  border-radius:6px;
  font-size:11px;
}

.overlay-menu button:hover{
  background:var(--panel2);
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:22px;
  transform:translate(-50%,20px);
  background:#111827;
  color:#fff;
  padding:9px 15px;
  border-radius:9px;
  font-size:11px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  z-index:200;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* SPECIAL MODES */

body.compact .message{
  margin-bottom:9px;
}

body.compact .bubble{
  padding:8px 11px;
}

body.compact .messages{
  padding-top:15px;
}

body.noanimations *{
  transition:none!important;
  animation:none!important;
}

body.fullscreen .right{
  display:none;
}

body.fullscreen .sidebar{
  display:none;
}

body.mobile-sidebar .sidebar{
  display:flex;
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  z-index:120;
  box-shadow:var(--shadow);
}

/* RESPONSIVE */

@media(max-width:1050px){
  .right{
    display:none;
  }
}

@media(max-width:700px){

  .sidebar{
    display:none;
  }

  .messages,
  .composer-wrap{
    padding-left:10px;
    padding-right:10px;
  }

  .quick{
    grid-template-columns:1fr;
  }

  .msgbody{
    max-width:88%;
  }

  .top{
    padding:0 9px;
  }

  .welcome h2{
    font-size:24px;
  }

  .top-actions .icon:nth-child(3){
    display:none;
  }

}

</style>
</head>

<body>

<div class="app">

<aside class="sidebar" id="sidebar">

  <div class="brand">

    <div class="logo" id="appLogo">
      AI
    </div>

    <div class="hide-collapse">
      <h1>Simple Chat AI</h1>
      <small>AI Workspace</small>
    </div>

  </div>

  <button class="newchat" id="newChat">
    ＋ New Chat
  </button>

  <div class="search">
    <span>⌕</span>
    <input id="search" placeholder="Search chats...">
  </div>

  <div class="history-label hide-collapse">
    Chats
  </div>

  <div class="history" id="history"></div>

  <div class="side-bottom">

    <button class="side-btn" id="collapseBtn">
      ☰ <span class="hide-collapse">Collapse</span>
    </button>

    <button class="side-btn" id="settingsBtn">
      ⚙ <span class="hide-collapse">Settings</span>
    </button>

    <button class="side-btn" id="themeBtn">
      ◐ <span class="hide-collapse">Theme</span>
    </button>

    <button class="side-btn" id="mobileMenuBtn">
      ☷ <span class="hide-collapse">Mobile Menu</span>
    </button>

  </div>

</aside>


<main class="main">

<section class="chat">

<header class="top">

  <div class="title">

    <strong id="chatTitle">
      New Chat
    </strong>

    <span class="badge" id="personaBadge">
      Assistant
    </span>

    <span class="privacy-badge" id="privacyBadge">
      PRIVATE
    </span>

  </div>

  <div class="top-actions">

    <button
      class="icon"
      id="favoriteBtn"
      title="Favorite">
      ☆
    </button>

    <button
      class="icon"
      id="renameBtn"
      title="Rename">
      ✎
    </button>

    <button
      class="icon"
      id="archiveBtn"
      title="Archive">
      ▣
    </button>

    <button
      class="icon"
      id="fullscreenBtn"
      title="Fullscreen">
      ⛶
    </button>

    <button
      class="icon"
      id="moreBtn"
      title="More">
      ⋯
    </button>

  </div>

</header>


<div class="messages" id="messages">

  <div class="welcome" id="welcome">

    <div class="welcome-logo">
      AI
    </div>

    <h2>
      What can I help you with?
    </h2>

    <p>
      Your all-in-one AI workspace.
    </p>

    <div class="quick">

      <button
        data-prompt="Explain this topic clearly and simply.">
        💡 Explain something
      </button>

      <button
        data-prompt="Give me creative ideas for a new project.">
        ✨ Generate ideas
      </button>

      <button
        data-prompt="Help me write something professional.">
        ✍ Writing help
      </button>

      <button
        data-prompt="Teach me something interesting step by step.">
        📚 Teach me
      </button>

    </div>

  </div>

</div>


<div class="composer-wrap">

  <div class="toolbar">

    <button class="tool" data-action="bold">
      B
    </button>

    <button class="tool" data-action="italic">
      I
    </button>

    <button class="tool" data-action="heading">
      H
    </button>

    <button class="tool" data-action="bullet">
      • List
    </button>

    <button class="tool" data-action="code">
      Code
    </button>

    <button class="tool" data-action="quote">
      Quote
    </button>

    <button class="tool" data-action="summarize">

function load(){

  try{

    chats =
      JSON.parse(
        localStorage.getItem(CHAT_KEY) || "[]"
      );

    if(!Array.isArray(chats)){
      chats=[];
    }

  }catch{
    chats=[];
  }


  try{

    files =
      JSON.parse(
        localStorage.getItem(FILE_KEY) || "[]"
      );

    if(!Array.isArray(files)){
      files=[];
    }

  }catch{
    files=[];
  }


  try{

    const stored =
      JSON.parse(
        localStorage.getItem(SETTING_KEY) || "{}"
      );

    if(
      stored &&
      typeof stored==="object"
    ){

      settings={
        ...settings,
        ...stored
      };

    }

  }catch{}


  /*
   * Privacy mode is never restored.
   * A temporary chat should not suddenly
   * become persistent after a reload.
   */

  temporaryMode=false;
  settings.privacy=false;


  if(!chats.length){

    createChat(false);

  }else{

    currentId =
      chats[0].id;

  }


  applySettings();
  renderHistory();
  renderChat();
}


function save(){

  if(!temporaryMode){

    localStorage.setItem(
      CHAT_KEY,
      JSON.stringify(chats)
    );

  }

  localStorage.setItem(
    FILE_KEY,
    JSON.stringify(files)
  );

  localStorage.setItem(
    SETTING_KEY,
    JSON.stringify(settings)
  );
}


function saveChatsOnly(){

  if(temporaryMode){
    return;
  }

  localStorage.setItem(
    CHAT_KEY,
    JSON.stringify(chats)
  );
}


function current(){

   CHAT CREATION

  const chat={

    id:
      Date.now().toString()+
      Math.random().toString(36).slice(2),

    name:"New Chat",

    messages:[],

    favorite:false,

    archived:false,

    folder:"",

    created:Date.now(),

    temporary:temporaryMode

  };


  chats.unshift(chat);

  currentId=chat.id;

  if(!temporaryMode){
    saveChatsOnly();
  }


  if(render){

    renderHistory();
    renderChat();

  }

}


/* =========================================================

========================================================= */

function renderHistory(){

  const q =
    $("search").value
      .trim()
      .toLowerCase();

  history.innerHTML="";


  chats
    .filter(c=>!c.archived)
    .filter(c=>
      !q ||
      c.name.toLowerCase().includes(q) ||
      c.messages.some(
        m=>
          typeof m.content==="string" &&
          m.content.toLowerCase().includes(q)
      )
    )
    .forEach(chat=>{

      const row =
        document.createElement("div");

      row.className =
        "history-item"+
        (chat.id===currentId
          ?" active"
          :"");


      if(chat.favorite){

        const star =
          document.createElement("span");

        star.className="star";

        star.textContent="★";

        row.appendChild(star);

      }


      const name =
        document.createElement("div");

      name.className="history-name";

      name.textContent =
        chat.name;


      const more =
        document.createElement("button");

      more.className=
        "history-more";

      more.textContent="⋯";


      more.onclick=e=>{

        e.stopPropagation();

        openChatMenu(
          chat,
          e.clientX,
          e.clientY
        );

      };


      row.append(
        name,
        more
      );


      row.onclick=()=>{

        currentId=chat.id;

        renderHistory();

        renderChat();

      };


      history.appendChild(row);

    });

}

  chat,

  y

    [
      "Archive",

    [
      "Move to folder",
      ()=>moveFolder(chat)

      "Delete",
      ()=>deleteChat(chat)

  options.forEach(
    ([text,fn])=>{

      b.textContent=text;

      b.onclick=()=>{

        menu.classList.remove("show");

        fn();

      x,
      window.innerWidth-190

  menu.style.top =
    Math.min(
      y,
      window.innerHeight-250

/* =========================================================
   MARKDOWN
========================================================= */

function escapeHTML(text){

  const d =
    document.createElement("div");

  d.textContent =
    text;

  return d.innerHTML;

}


function inlineMD(text){

  let s =
    escapeHTML(text);


  s=s.replace(
    /`([^`]+)`/g,
    "<code>$1</code>"
  );


  s=s.replace(
    /\*\*([\s\S]+?)\*\*/g,
    "<strong>$1</strong>"
  );


  s=s.replace(
    /__([\s\S]+?)__/g,
    "<strong>$1</strong>"
  );


  s=s.replace(
    /\*([^*]+)\*/g,
    "<em>$1</em>"
  );


  s=s.replace(
    /_([^_]+)_/g,
    "<em>$1</em>"
  );


  s=s.replace(
    /~~(.+?)~~/g,
    "<del>$1</del>"
  );


  s=s.replace(
    /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener">$1</a>'
  );


  return s;
}


function markdown(text){

  const lines =
    text
      .replace(/\r/g,"")
      .split("\n");

  let out="";

  let inCode=false;

  let code="";

  let listType="";

  let table=false;


  for(
    let i=0;
    i<lines.length;
    i++
  ){

    const line =
      lines[i];


    if(
      line.startsWith("```")
    ){

      if(!inCode){

        inCode=true;

        code="";

      }else{

        out+=
          "<pre><code>"+
          escapeHTML(code)+
          "</code></pre>";

        inCode=false;

      }

      continue;
    }


    if(inCode){

      code+=
        line+"\n";

      continue;

    }


    if(
      /^---+$/.test(
        line.trim()
      )
    ){

      out+="<hr>";

      continue;

    }


    if(
      /^\s*\|/.test(line) &&
      i+1<lines.length &&
      lines[i+1].includes("---")
    ){

      const headers =
        line
          .split("|")
          .slice(1,-1);

      out+="<table><thead><tr>";

      headers.forEach(
        h=>{
          out+=
            "<th>"+
            inlineMD(h.trim())+
            "</th>";
        }
      );

      out+=
        "</tr></thead><tbody>";

      i++;

      table=true;

      continue;
    }


    if(
      table &&
      /^\s*\|/.test(line)
    ){

      const cells =
        line
          .split("|")
          .slice(1,-1);

      out+="<tr>";

      cells.forEach(
        c=>{
          out+=
            "<td>"+
            inlineMD(c.trim())+
            "</td>";
        }
      );

      out+="</tr>";

      continue;

    }else if(table){

      out+=
        "</tbody></table>";

      table=false;

    }


    const heading =
      line.match(
        /^(#{1,6})\s+(.+)$/
      );

    if(heading){

      const level =
        heading[1].length;

      out+=
        "<h"+
        level+
        ">"+
        inlineMD(heading[2])+
        "</h"+
        level+
        ">";

      continue;

    }


    const quote =
      line.match(
        /^>\s?(.*)$/
      );

    if(quote){

      out+=
        "<blockquote>"+
        inlineMD(quote[1])+
        "</blockquote>";

      continue;

    }


    const bullet =
      line.match(
        /^\s*[-*+]\s+(.+)$/
      );

    if(bullet){

      if(listType!=="ul"){

        if(listType){
          out+="</ol>";
        }

        out+="<ul>";

        listType="ul";

      }

      out+=
        "<li>"+
        inlineMD(bullet[1])+
        "</li>";

      continue;

    }


    const ordered =
      line.match(
        /^\s*\d+\.\s+(.+)$/
      );

    if(ordered){

      if(listType!=="ol"){

        if(listType){
          out+="</ul>";
        }

        out+="<ol>";

        listType="ol";

      }

      out+=
        "<li>"+
        inlineMD(ordered[1])+
        "</li>";

      continue;

    }


    if(listType){

      out+=
        listType==="ul"
          ?"</ul>"
          :"</ol>";

      listType="";

    }


    if(!line.trim()){
      continue;
    }


    out+=
      "<p>"+
      inlineMD(line)+
      "</p>";

  }


  if(listType){

    out+=
      listType==="ul"
        ?"</ul>"
        :"</ol>";

  }


  if(table){
    out+="</tbody></table>";
  }


  return out;
}


/* =========================================================
   SEND
========================================================= */

async function sendMessage(){

  if(generating){

    stopGeneration();

    return;

  }


  const text =
    input.value.trim();

  if(!text){
    return;
  }


  const chat=current();

  if(!chat){
    return;
  }


  const file =
    getSelectedFile();


  const messageObject={

    role:"user",

    content:text,

    time:Date.now()

  };


  if(file){

    messageObject.fileName =
      file.name;

  }


  if(selectedImage){

    messageObject.imageName =
      selectedImageName;

    messageObject.imagePreview =
      selectedImage;

  }


  chat.messages.push(
    messageObject
  );


  if(
    chat.messages.filter(
      m=>m.role==="user"
    ).length===1
  ){

    chat.name =
      text.length>40
        ?text.slice(0,40)+"..."
        :text;

  }


  input.value="";

  resizeInput();

  updateCounter();

  clearAttachment();


  if(!temporaryMode){

    saveChatsOnly();

  }


  renderHistory();

  renderChat();


  await generate(
    text,
    file
  );

}


/* =========================================================
   GENERATE
========================================================= */

async function generate(
  userText,
  file=null,
  extraPrompt=""
){

  if(generating){
    return;
  }


  const chat=current();

  if(!chat){
    return;
  }


  generating=true;

  controller =
    new AbortController();


  send.classList.add(
    "stop"
  );

  send.textContent="■";


  showTyping();


  try{

    const historyData =
      chat.messages
        .slice(0,-1)
        .map(m=>({

          role:m.role,

          content:
            m.content

        }));


    const persona =
      getPersona();


    let system =
      persona.instructions;


    if(settings.mode==="Concise"){

      system+=
        "\nKeep the answer concise and focused.";

    }


    if(settings.mode==="Detailed"){

      system+=
        "\nGive a detailed explanation with useful examples.";

    }


    if(settings.mode==="Creative"){

      system+=
        "\nUse creative and varied approaches.";

    }


    if(settings.answerLength==="Short"){

      system+=
        "\nKeep the response short.";

    }


    if(settings.answerLength==="Long"){

      system+=
        "\nGive a longer, more comprehensive response.";

    }


    if(settings.answerLength==="Detailed"){

      system+=
        "\nGive a highly detailed response.";

    }


    if(settings.language &&
       settings.language!=="Auto"){

      system+=
        "\nRespond in "+
        settings.language+
        " unless the user explicitly requests another language.";

    }


    if(settings.tone){

      system+=
        "\nUse a "+
        settings.tone+
        " tone.";

    }


    if(settings.customInstructions){

      system+=
        "\nCustom user instructions:\n"+
        settings.customInstructions;

    }


    if(settings.memory.length){

      system+=
        "\nUseful long-term memory about the user. Use it only when relevant:\n"+
        settings.memory
          .map(x=>"- "+x)
          .join("\n");

    }


    if(file){

      const fileText =
        file.content || "";

      const limited =
        fileText.slice(
          0,
          50000
        );

      system+=
        "\nThe user attached a text file named "+
        file.name+
        ". Use its contents when relevant. "+
        "Do not claim you cannot access it.\n"+
        "\nFILE CONTENT:\n"+
        limited;

    }


    if(extraPrompt){

      system+=
        "\nAdditional task:\n"+
        extraPrompt;

    }


    const body={

      message:userText,

      history:historyData,

      systemPrompt:system,

      temperature:
        Number(settings.temperature),

      maxTokens:
        Number(settings.maxTokens)

    };


    if(selectedImage){

      body.imageData =
        selectedImage;

    }


    const response =
      await fetch(
        "/.netlify/functions/chat",
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(body),

          signal:
            controller.signal

        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "The AI request failed."
      );

    }


    if(!data.reply){

      throw new Error(
        "The AI returned no response."
      );

    }


    removeTyping();


    chat.messages.push({

      role:"assistant",

      content:data.reply,

      time:Date.now(),

      pinned:false,

      reaction:""

    });


    if(!temporaryMode){

      saveChatsOnly();

    }


    renderChat();


    /*
     * Automatically offer follow-ups.
     */

    showFollowupChips(
      data.reply
    );


  }catch(err){

    removeTyping();


    if(
      err.name!=="AbortError"
    ){

      chat.messages.push({

        role:"assistant",

        content:
          "**Error:** "+
          err.message

      });


      if(!temporaryMode){

        saveChatsOnly();

      }


      renderChat();

    }

  }finally{

    generating=false;

    controller=null;

    send.classList.remove(
      "stop"
    );

    send.textContent="➤";

  }

}

/* =========================================================
   REGENERATE
========================================================= */

async function regenerate(index){

  const chat=current();

  if(
    !chat ||
    generating
  ){
    return;
  }


  const assistant =
    chat.messages[index];

  const user =
    chat.messages[index-1];


  if(
    !assistant ||
    assistant.role!=="assistant" ||
    !user ||
    user.role!=="user"
  ){
    return;
  }


  chat.messages.splice(
    index,
    1
  );


  saveChatsOnly();

  renderChat();


  await generate(
    user.content
  );

}

   EDIT
========================================================= */

function editMessage(index){

  const chat=current();

  if(!chat){

  const m =

    !m ||
    m.role!=="user"
  ){

  }


  input.value =
    m.content;


  chat.messages =
    chat.messages.slice(
      0,
      index
    );


  saveChatsOnly();

  renderChat();

  resizeInput();

  updateCounter();

  input.focus();

}

function readAloud(text){

  ){

    );

    return;

  }


  speechSynthesis.cancel();


  const utterance =

  utterance.pitch=1;


  speechSynthesis.speak(
    utterance
  );


  toastMsg(

  );

}


/* =========================================================
   VOICE INPUT
========================================================= */

function startVoice(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if(!SpeechRecognition){

    toastMsg(
      "Voice input is not supported in this browser."
    );

    return;

  }


  if(listening){

    if(recognition){
      recognition.stop();
    }

    return;

  }


  recognition =
    new SpeechRecognition();


  recognition.lang =
    languageCode(
      settings.language
    );

  recognition.interimResults=
    true;

  recognition.continuous=
    false;


  recognition.onstart=()=>{

    listening=true;

    $("voiceBtn").textContent=
      "⏹ Stop Voice";

    toastMsg(
      "Listening..."
    );

  };


  recognition.onresult=e=>{

    let finalText="";

    for(
      let i=e.resultIndex;
      i<e.results.length;
      i++
    ){

      finalText+=
        e.results[i][0].transcript;

    }


    input.value =
      finalText;

    resizeInput();

    updateCounter();

  };


  recognition.onerror=()=>{

    listening=false;

    $("voiceBtn").textContent=
      "🎤 Voice";

    toastMsg(
      "Voice input error"
    );

  };


  recognition.onend=()=>{

    listening=false;

    $("voiceBtn").textContent=
      "🎤 Voice";

  };


  recognition.start();

}


/* =========================================================
   LANGUAGE
========================================================= */

function languageCode(
  language
){

  const map={

    English:"en-US",
    Urdu:"ur-PK",
    Arabic:"ar-SA",
    Chinese:"zh-CN",
    Spanish:"es-ES",
    French:"fr-FR",
    German:"de-DE",
    Hindi:"hi-IN",
    Turkish:"tr-TR"

  };


  return map[language] ||
    "en-US";
}


/* =========================================================
   FOLLOW-UP SUGGESTIONS
========================================================= */

async function showFollowupChips(
  responseText
){

  /*
   * Generate suggestions only after
   * a normal response. This is kept
   * optional so the user can ignore it.
   */

  try{

    const suggestions =
      await directAI(
        "Based on this AI response, generate exactly 3 short useful follow-up questions. Return ONLY the 3 questions, one per line, with no numbering.\n\n"+
        responseText.slice(0,7000)
      );


    const lines =
      suggestions
        .split("\n")
        .map(x=>x.trim())
        .filter(Boolean)
        .slice(0,3);


    if(!lines.length){
      return;
    }


    const old =
      $("followupChips");

    if(old){
      old.remove();
    }


    const box =
      document.createElement("div");

    box.id=
      "followupChips";

    box.style.maxWidth=
      "900px";

    box.style.margin=
      "0 auto 12px";

    box.innerHTML=
      "<div style='font-size:10px;color:var(--muted);margin-bottom:5px'>Suggested follow-ups</div>";


    const row =
      document.createElement("div");

    row.className=
      "chip-row";


    lines.forEach(
      question=>{

        const button =
          document.createElement("button");

        button.className=
          "chip";

        button.textContent=
          question;

        button.onclick=()=>{

          input.value=
            question;

          resizeInput();

          updateCounter();

          input.focus();

        };


        row.appendChild(
          button
        );

      }
    );


    box.appendChild(row);

    messages.appendChild(box);

    messages.scrollTop=
      messages.scrollHeight;


  }catch{

    /*
     * Follow-ups are optional.
     * Never make the main answer fail
     * because suggestions failed.
     */

  }

}


/* =========================================================
   DIRECT AI
========================================================= */

async function directAI(
  prompt,
  options={}
){

  const chat=current();


  const response =
    await fetch(
      "/.netlify/functions/chat",
      {

        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({

            message:prompt,

            history:
              chat
                ?chat.messages.slice(-10)
                :[],

            systemPrompt:
              options.system ||
              getSystem(),

            temperature:
              options.temperature ??
              Number(settings.temperature),

            maxTokens:
              options.maxTokens ??
              Number(settings.maxTokens)

          })

      }
    );


  const data =
    await response.json();


  if(!response.ok){

    throw new Error(
      data.error ||
      "AI request failed"
    );

  }


  return data.reply || "";

}

/* =========================================================
   ARCHIVE
========================================================= */

function archiveChat(
  chat=current()
){

  if(!chat){
    return;
  }


  chat.archived=true;


  if(chat.id===currentId){

    const next =
      chats.find(
        c=>
          !c.archived &&
          c.id!==chat.id
      );


    if(next){

      currentId=
        next.id;

    }else{

      createChat(false);

    }

  }


  saveChatsOnly();

  renderHistory();

  renderChat();

  toastMsg(
    "Chat archived"
  );

}


/* =========================================================
   DELETE
========================================================= */

function deleteChat(chat){

  if(
    !confirm(
      "Delete this chat permanently?"
    )
  ){
    return;
  }


  chats =
    chats.filter(
      c=>c.id!==chat.id
    );


  if(!chats.length){

    createChat(false);

  }else if(
    currentId===chat.id
  ){

    currentId=
      chats[0].id;

  }


  saveChatsOnly();

  renderHistory();

  renderChat();

  toastMsg(
    "Chat deleted"
  );

}


/* =========================================================

========================================================= */

function duplicateChat(chat){

  const cloned =
    JSON.parse(
      JSON.stringify(chat)
    );


  cloned.id =
    Date.now().toString()+
    Math.random()
      .toString(36)
      .slice(2);


  cloned.name =
    chat.name+" Copy";


  cloned.created=
    Date.now();


  chats.unshift(
    cloned
  );


  currentId=
    cloned.id;


  saveChatsOnly();

  renderHistory();

  renderChat();

  toastMsg(
    "Chat duplicated"
  );

}

window.calculateExpression=()=>{

      );


    $("calcResult")

      .textContent=
        "Invalid mathematical expression.";

  }

};


/*
 * Safe arithmetic evaluator.
 *
 * No arbitrary JavaScript execution.
 */

function safeCalculate(
  expression
){

  let s =
    expression
      .replace(/×/g,"*")
      .replace(/÷/g,"/")
      .replace(/−/g,"-")
      .replace(/\^/g,"**")
      .replace(/,/g,"");


  if(
    !/^[0-9+\-*/().%\s*]+$/.test(s)
  ){
    throw new Error("Invalid");
  }


  /*
   * Function is used only after
   * restricting the expression to
   * arithmetic characters.
   */

  return Function(
    '"use strict";return ('+
    s+
    ')'
  )();

}

========================================================= */

$("attachBtn").onclick=()=>
  $("fileInput").click();

  openFiles;


$("fileInput").onchange=e=>{

  handleFiles(
    e.target.files
  );

};


function handleFiles(
  list
){

  [
    ...list
  ].forEach(
    file=>{

      const lower =
        file.name.toLowerCase();


      if(
        !lower.endsWith(".txt") &&
        !lower.endsWith(".md") &&
        !lower.endsWith(".csv")
      ){

        toastMsg(
          "Unsupported file: "+
          file.name
        );

        return;

      }


      const reader =
        new FileReader();


      reader.onload=()=>{

        const existing =
          files.find(
            f=>
              f.name===
              file.name
          );


        const item={

          name:file.name,

          size:file.size,

          type:file.type,

          content:
            String(
              reader.result || ""
            )

        };


        if(existing){

          Object.assign(
            existing,
            item
          );

        }else{

          files.push(item);

        }


        save();

        toastMsg(
          file.name+
          " added"
        );

      };


      reader.readAsText(
        file
      );

    }
  );

}


function getSelectedFile(){

  if(!settings.selectedFile){
    return null;
  }


  return files.find(
    f=>
      f.name===
      settings.selectedFile
  ) || null;

}


function openFiles(){

  openModal(`

    <div class="modal-head">
      <h2>File Library</h2>
      <button class="close"
        onclick="closeModal()">×</button>
    </div>

    <div
      class="dropzone"
      id="dropzone">

      <strong>
        Drop TXT, MD or CSV files here
      </strong>

      <br><br>

      <button
        class="pbtn"
        onclick="document.getElementById('fileInput').click()">
        Choose Files
      </button>

    </div>

    <div id="fileList">
    </div>

  `);


  renderFiles();


  const dz =
    $("dropzone");


  dz.ondragover=e=>{

    e.preventDefault();

    dz.classList.add(
      "drag"
    );

  };


  dz.ondragleave=()=>{

    dz.classList.remove(
      "drag"
    );

  };


  dz.ondrop=e=>{

    e.preventDefault();

    dz.classList.remove(
      "drag"
    );

    handleFiles(
      e.dataTransfer.files
    );

    setTimeout(
      renderFiles,
      300
    );

  };

}


function renderFiles(){

  const el =
    $("fileList");


  if(!el){
    return;
  }


  el.innerHTML="";


  if(!files.length){

    el.innerHTML=
      '<p style="font-size:11px;color:var(--muted)">No files yet.</p>';

    return;

  }


  files.forEach(
    (file,i)=>{

      const row =
        document.createElement(
          "div"
        );

      row.className=
        "file-item";


      const info =
        document.createElement(
          "span"
        );

      info.textContent=
        "📄 "+
        file.name;


      const buttons =
        document.createElement(
          "span"
        );


      const use =
        document.createElement(
          "button"
        );

      use.className=
        "file-use";

      use.textContent=
        settings.selectedFile===
        file.name
          ?"Selected"
          :"Use";


      use.onclick=()=>{

        settings.selectedFile=
          file.name;

        save();

        renderFiles();

        toastMsg(
          file.name+
          " selected for Q&A"
        );

      };


      const remove =
        document.createElement(
          "button"
        );

      remove.className=
        "file-use";

      remove.style.color=
        "var(--danger)";

      remove.textContent=
        "Delete";


      remove.onclick=()=>{

        files.splice(
          i,
          1
        );


        if(
          settings.selectedFile===
          file.name
        ){

          settings.selectedFile="";

        }


        save();

        renderFiles();

      };


      buttons.append(
        use,
        remove
      );


      row.append(
        info,
        buttons
      );


      el.appendChild(row);

    }
  );

}

  const html=`

    ?markdown(m.content)
    :escapeHTML(m.content)
       .replace(/\n/g,"<br>")
}

`
).join("")}

</body>

  download(

  );


  toastMsg(
    "HTML exported"
  );

}


function download(
  name,
  text,
  type
){

  const blob =
    new Blob(
      [text],
      {type}
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );


  a.href=url;

  a.download=
    name.replace(
      /[<>:"/\\|?*]/g,
      "_"
    );


  document.body.appendChild(a);

  a.click();

  a.remove();

  setTimeout(
    ()=>URL.revokeObjectURL(url),
    1000
  );

}

        onclick="closeModal()">×</button>
    </div>

    <div class="field">

      <label>
        Theme
      </label>

      <select id="themeSetting">

        <option value="light">
          Light
        </option>

        <option value="dark">
          Dark
        </option>

      </select>

    </div>


    <div class="field">

      <label>
        Animations
      </label>

      <select id="animationSetting">

        <option value="on">
          On
        </option>

        <option value="off">
          Off
        </option>

      </select>

    </div>


    <button
      class="save"
      onclick="saveGeneralSettings()">
      Save Settings
    </button>

  `);


  $("themeSetting").value=
    settings.theme;

  $("animationSetting").value=
    settings.animations
      ?"on"
      :"off";


  window.saveGeneralSettings=()=>{

    settings.theme=
      $("themeSetting").value;

    settings.animations=
      $("animationSetting").value===
      "on";


    applySettings();

    save();

    closeModal();

    toastMsg(
      "Settings saved"
    );

  };

};


/* =========================================================

========================================================= */

function applySettings(){

  document.body.classList.toggle(
    "dark",
    settings.theme==="dark"
  );


  document.body.classList.toggle(
    "compact",
    settings.density==="compact"
  );


  document.body.classList.toggle(
    "noanimations",
    !settings.animations
  );


  document.documentElement
    .style
    .setProperty(
      "--accent",
      settings.accent
    );


  if(
    settings.background===
    "blue"
  ){

    document.body.style.background=
      "linear-gradient(135deg,#edf4ff,#f6f2ff)";

  }else if(
    settings.background===
    "purple"
  ){

    document.body.style.background=
      "linear-gradient(135deg,#f5efff,#eef0ff)";

  }else if(
    settings.background===
    "dark"
  ){

    document.body.style.background=
      "#090d17";

  }else{

    document.body.style.background=
      "var(--bg)";

  }


  $("appLogo").textContent=
    settings.avatar;

  $("personaBadge").textContent=
    settings.persona;


  updatePersonaButtons();

}

/* =========================================================
   BRANCH
========================================================= */

function branchChat(){

  const chat=current();

  if(!chat){
    return;
  }


  const branch =
    JSON.parse(
      JSON.stringify(chat)
    );


  branch.id=
    Date.now().toString()+
    Math.random()
      .toString(36)
      .slice(2);


  branch.name=
    chat.name+
    " — Branch";


  branch.created=
    Date.now();


  chats.unshift(
    branch
  );


  currentId=
    branch.id;


  saveChatsOnly();

  renderHistory();

  renderChat();

  toastMsg(
    "Conversation branched"
  );

}


/* =========================================================
   CLEAR
========================================================= */

function clearConversation(){

  const chat=current();

  if(!chat){
    return;
  }


  if(
    !confirm(
      "Clear this conversation?"
    )
  ){
    return;
  }


  chat.messages=[];

  saveChatsOnly();

  renderChat();

  toastMsg(
    "Conversation cleared"
  );

}

/* =========================================================
   TOOLBAR
========================================================= */

document
  .querySelectorAll(
    ".tool[data-action]"
  )
  .forEach(button=>{

    button.onclick=()=>{

      const action=
        button.dataset.action;


      if(action==="bold"){
        wrapSelection(
          "**",
          "**"
        );
      }


      if(action==="italic"){
        wrapSelection(
          "*",
          "*"
        );
      }


      if(action==="heading"){
        wrapSelection(
          "# ",
          ""
        );
      }


      if(action==="bullet"){
        wrapSelection(
          "- ",
          ""
        );
      }


      if(action==="code"){
        wrapSelection(
          "`",
          "`"
        );
      }


      if(action==="quote"){
        wrapSelection(
          "> ",
          ""
        );
      }


      if(action==="summarize"){

        input.value=
          "Summarize this:\n\n"+
          input.value;

      }


      if(action==="translate"){

        input.value=
          "Translate this into English:\n\n"+
          input.value;

      }


      if(action==="grammar"){

        input.value=
          "Correct the grammar of this:\n\n"+
          input.value;

      }


      resizeInput();

      updateCounter();

    };

  });


function wrapSelection(
  before,
  after
){

  const start=
    input.selectionStart;

  const end=
    input.selectionEnd;


  const selected=
    input.value.slice(
      start,
      end
    );


  const value=
    selected ||
    "text";


  input.value=
    input.value.slice(0,start)+
    before+
    value+
    after+
    input.value.slice(end);


  input.focus();


  input.setSelectionRange(
    start+
      before.length,
    start+
      before.length+
      value.length
  );

}


/* =========================================================
   INPUT
========================================================= */

input.addEventListener(

    updateCounter();

  }
);


input.addEventListener(

    ){

    }

  }
);

function resizeInput(){

  input.style.height=
    "auto";

  input.style.height=
    Math.min(
      input.scrollHeight,
      150
    )+
    "px";

}


function updateCounter(){

  const text=
    input.value;

  const words=
    text.trim()
      ?text.trim().split(/\s+/).length
      :0;


  $("counter").textContent=
    text.length+
    " characters · "+
    words+
    " words";

}


/* =========================================================
   STATS
========================================================= */

function updateStats(){

  const chat=current();

  if(!chat){
    return;
  }


  const users=
    chat.messages.filter(
      m=>m.role==="user"
    );


  const ai=
    chat.messages.filter(
      m=>m.role==="assistant"
    );


  const pinned=
    chat.messages.filter(
      m=>m.pinned
    );


  const words=
    users
      .map(
        m=>m.content
      )
      .join(" ")
      .trim();


  const count=
    words
      ?words.split(/\s+/).length
      :0;


  $("statMessages")
    .textContent=
      chat.messages.length;


  $("statWords")
    .textContent=
      count;


  $("statAI")
    .textContent=
      ai.length;


  $("statPinned")
    .textContent=
      pinned.length;

}

   MODAL
========================================================= */

function openModal(

){

    html;

  modalBg.classList.add(

  );

}


function closeModal(){

      )
    ){

      $("contextMenu")
        .classList.remove(
          "show"
        );

    }

  }
);


/* =========================================================
   TOAST
========================================================= */

let toastTimer;


function toastMsg(text){

  toast.textContent=
    text;

  toast.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer=
    setTimeout(
      ()=>{
        toast.classList.remove(
          "show"
        );
      },
      2200
    );

}


/* =========================================================
   KEYBOARD SHORTCUTS
========================================================= */

document.addEventListener(
  "keydown",
  e=>{

    if(
      (e.ctrlKey||e.metaKey) &&
      e.key.toLowerCase()==="k"
    ){

      e.preventDefault();

      $("search").focus();

    }


    if(
      (e.ctrlKey||e.metaKey) &&
      e.key.toLowerCase()==="n"
    ){

      e.preventDefault();

      createChat();

    }


    if(
      (e.ctrlKey||e.metaKey) &&
      e.key.toLowerCase()==="e"
    ){

      e.preventDefault();

      exportMarkdown();

    }


    if(e.key==="Escape"){

      closeModal();

      $("contextMenu")
        .classList.remove(
          "show"
        );

    }

  }
);


/* =========================================================
   DRAG AND DROP
========================================================= */

document.addEventListener(
  "dragover",
  e=>{

    if(
      e.dataTransfer &&
      e.dataTransfer.types.includes(
        "Files"
      )
    ){

      e.preventDefault();

    }

  }
);


document.addEventListener(
  "drop",
  e=>{

    if(
      e.dataTransfer &&
      e.dataTransfer.files.length
    ){

      e.preventDefault();

      handleFiles(
        e.dataTransfer.files
      );

      toastMsg(
        "Files added"
      );

    }

  }
);

========================================================= */

setupModes();

load();

updateCounter();
