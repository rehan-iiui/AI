      border-radius:7px;
      background:var(--surface);
      color:var(--muted);
      font-size:10px;
      font-weight:800;
      white-space:nowrap;
    }

    /* ---------- MOBILE ---------- */

    @media(max-width:800px){
      .usage-header{
        display:none;
      }

      .language-button{
        width:44px;
        padding:0;
        justify-content:center;
      }

      .language-button .language-name{
        display:none;
      }
    }

    @media(max-width:600px){
      .extra-header-button{
        width:40px;
        height:40px;
      }

      .language-button{
        width:40px;
        height:40px;
      }

      .header-actions{
        gap:4px;
      }
    }
  `;

  document.head.appendChild(style);


  /* ========================================================
     1. LIVE AI STATUS
  ======================================================== */

  const statusElement = document.querySelector(".status");
  const statusDot = statusElement
    ? statusElement.querySelector(".status-dot")
    : null;

  let statusText = statusElement
    ? statusElement.querySelector(".status-text")
    : null;

  if(statusElement && statusDot){

    if(!statusText){
      statusText = document.createElement("span");
      statusText.className = "status-text";

      const oldText = Array.from(statusElement.childNodes)
        .find(node =>
          node.nodeType === Node.TEXT_NODE &&
          node.textContent.trim()
        );

      if(oldText){
        oldText.remove();
      }

      statusElement.appendChild(statusText);
    }

    function setStatus(state){
      statusDot.classList.remove(
        "status-thinking",
        "status-offline"
      );

      statusText.classList.remove(
        "status-thinking",
        "status-offline"
      );

      if(state === "thinking"){
        statusText.textContent = "Thinking...";
        statusDot.classList.add("status-thinking");
        statusText.classList.add("status-thinking");
      }
      else if(state === "offline"){
        statusText.textContent = "Offline";
        statusDot.classList.add("status-offline");
        statusText.classList.add("status-offline");
      }
      else{
        statusText.textContent = "AI Online";
      }
    }

    window.simpleChatSetStatus = setStatus;

    setStatus(navigator.onLine ? "online" : "offline");

    window.addEventListener("online", function(){
      setStatus("online");
      toast("Connection restored.");
    });

    window.addEventListener("offline", function(){
      setStatus("offline");
      toast("You are offline.");
    });

    /* Watch the existing typing message */
    const statusObserver = new MutationObserver(function(){
      const typing = document.getElementById("typingMessage");

      if(typing){
        setStatus("thinking");
      }
    });

    statusObserver.observe(
      document.getElementById("messages"),
      {
        childList:true,
        subtree:true
      }
    );

    /* Wrap fetch to detect successful / failed AI requests */
    const oldFetch = window.fetch.bind(window);

    window.fetch = function(resource, options){

      const url =
        typeof resource === "string"
          ? resource
          : ((resource && resource.url) || "");

      const isChatRequest =
        url.indexOf("/netlify/functions/chat") !== -1;

      if(isChatRequest){
        setStatus("thinking");

        return oldFetch(resource, options)
          .then(function(response){

            if(!response.ok){
              setStatus("offline");
            }else{
              setStatus("online");
            }

            return response;

          })
          .catch(function(error){

            if(error && error.name === "AbortError"){
              setStatus(navigator.onLine ? "online" : "offline");
            }else{
              setStatus("offline");
            }

            throw error;
          });
      }

      return oldFetch(resource, options);
    };

  }


  /* ========================================================
     2. HEADER NEW CHAT BUTTON
  ======================================================== */

  const headerActions = document.querySelector(".header-actions");

  const newChatHeader = document.createElement("button");

  newChatHeader.type = "button";
  newChatHeader.className = "extra-header-button";
  newChatHeader.id = "headerNewChat";
  newChatHeader.title = "New Chat";
  newChatHeader.setAttribute("aria-label","New Chat");
  newChatHeader.textContent = "➕";

  newChatHeader.addEventListener("click", function(){

    currentChat = makeChat();
    chats.unshift(currentChat);

    saveChats();
    render();

    input.value = "";
    autoResize();
    input.focus();

    toast("New chat created.");
  });

  headerActions.insertBefore(
    newChatHeader,
    document.getElementById("themeButton")
  );


  /* ========================================================
     3. HEADER SEARCH + CTRL+K
  ======================================================== */

  const searchHeader = document.createElement("button");

  searchHeader.type = "button";
  searchHeader.className = "extra-header-button";
  searchHeader.id = "headerSearch";
  searchHeader.title = "Search Chats (Ctrl+K)";
  searchHeader.setAttribute("aria-label","Search Chats");
  searchHeader.textContent = "🔍";

  searchHeader.addEventListener("click", function(){
    if(typeof searchChats === "function"){
      searchChats();
    }else{
      openModal(
        "🔍 Search Chats",
        `<div class="logic-answer">Search is not available yet.</div>`
      );
    }
  });

  headerActions.insertBefore(
    searchHeader,
    document.getElementById("themeButton")
  );

  document.addEventListener("keydown", function(event){

    if(
      (event.ctrlKey || event.metaKey) &&
      event.key.toLowerCase() === "k"
    ){
      event.preventDefault();

      if(typeof searchChats === "function"){
        searchChats();
      }
    }

  });


  /* ========================================================
     4. QUICK EXPORT / SHARE
  ======================================================== */

  const shareHeader = document.createElement("button");

  shareHeader.type = "button";
  shareHeader.className = "extra-header-button";
  shareHeader.id = "headerShare";
  shareHeader.title = "Export or Share Chat";
  shareHeader.setAttribute("aria-label","Export or Share Chat");
  shareHeader.textContent = "📤";

  shareHeader.addEventListener("click", async function(){

    ensureChat();

    let text = "Simple Chat AI\n";
    text += "Chat: " + (currentChat.title || "New Chat") + "\n\n";

    currentChat.messages.forEach(function(message){

      text +=
        (message.role === "user" ? "YOU" : "AI") +
        ":\n" +
        message.content +
        "\n\n";

    });

    /* Use native share if available */
    if(navigator.share){

      try{

        await navigator.share({
          title: currentChat.title || "Simple Chat AI",
          text: text
        });

        toast("Chat shared.");

        return;

      }catch(error){

        if(error && error.name === "AbortError"){
          return;
        }

      }

    }

    /* Otherwise copy */
    if(navigator.clipboard){

      try{

        await navigator.clipboard.writeText(text);

        toast("Chat copied to clipboard.");

        return;

      }catch(error){
        /* continue to download */
      }

    }

    /* Final fallback: download */
    const blob = new Blob(
      [text],
      {type:"text/plain;charset=utf-8"}
    );

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");

    a.href = url;
    a.download = "simple-chat-ai-chat.txt";

    document.body.appendChild(a);
    a.click();
    a.remove();

    setTimeout(function(){
      URL.revokeObjectURL(url);
    },1000);

    toast("Chat exported.");

  });

  headerActions.insertBefore(
    shareHeader,
    document.getElementById("themeButton")
  );


  /* ========================================================
     5. AUTO-READ TOGGLE
  ======================================================== */

  let autoRead =
    localStorage.getItem("simple_chat_auto_read") === "true";

  const autoReadButton = document.createElement("button");

  autoReadButton.type = "button";
  autoReadButton.className =
    "extra-header-button" +
    (autoRead ? " auto-read-on active" : "");

  autoReadButton.id = "autoReadButton";
  autoReadButton.title =
    autoRead
      ? "Auto-read ON — click to turn off"
      : "Auto-read OFF — click to turn on";

  autoReadButton.setAttribute(
    "aria-label",
    "Toggle automatic AI reading"
  );

  autoReadButton.innerHTML =
    '🔊<span class="auto-read-indicator"></span>';

  function updateAutoReadButton(){

    autoReadButton.classList.toggle(
      "auto-read-on",
      autoRead
    );

    autoReadButton.classList.toggle(
      "active",
      autoRead
    );

    autoReadButton.title =
      autoRead
        ? "Auto-read ON — click to turn off"
        : "Auto-read OFF — click to turn on";

  }

  autoReadButton.addEventListener("click", function(){

    autoRead = !autoRead;

    localStorage.setItem(
      "simple_chat_auto_read",
      autoRead ? "true" : "false"
    );

    updateAutoReadButton();

    if(!autoRead && "speechSynthesis" in window){
      speechSynthesis.cancel();
    }

    toast(
      autoRead
        ? "Auto-read enabled."
        : "Auto-read disabled."
    );

  });

  headerActions.insertBefore(
    autoReadButton,
    document.getElementById("themeButton")
  );

  updateAutoReadButton();


  /* ========================================================
     AUTO-READ AFTER AI RESPONSE
  ======================================================== */

  let lastReadMessage = null;

  const originalRender = window.render;

  if(typeof originalRender === "function"){

    window.render = function(){

      originalRender();

      if(!autoRead){
        return;
      }

      if(!currentChat || !currentChat.messages.length){
        return;
      }

      const messages = currentChat.messages;

      const last =
        messages[messages.length - 1];

      if(
        !last ||
        last.role !== "assistant" ||
        String(last.content).startsWith("⚠️")
      ){
        return;
      }

      if(lastReadMessage === last.content){
        return;
      }

      lastReadMessage = last.content;

      if(!("speechSynthesis" in window)){
        return;
      }

      speechSynthesis.cancel();

      const speech =
        new SpeechSynthesisUtterance(last.content);

      speech.lang =
        localStorage.getItem(
          "simple_chat_language_code"
        ) || "en-US";

      speech.rate = 1;
      speech.pitch = 1;

      speechSynthesis.speak(speech);

    };

  }


  /* ========================================================
     6. TOTAL AI TOOL USAGE METER
  ======================================================== */

  const TOTAL_LIMIT = 300;
  const TOTAL_KEY = "simple_chat_total_tool_uses";

  let totalUses =
    parseInt(
      localStorage.getItem(TOTAL_KEY) || "0",
      10
    );

  if(!Number.isFinite(totalUses)){
    totalUses = 0;
  }

  const usageHeader =
    document.createElement("button");

  usageHeader.type = "button";
  usageHeader.className = "usage-header";
  usageHeader.id = "usageHeader";
  usageHeader.title =
    "Total AI tool uses remaining";

  usageHeader.innerHTML = `
    <div class="usage-top">
      <span>AI Uses</span>
      <span class="usage-number" id="usageNumber">300 left</span>
    </div>
    <div class="usage-track">
      <div class="usage-fill" id="usageFill"></div>
    </div>
  `;

  function updateUsageMeter(){

    const remaining =
      Math.max(
        0,
        TOTAL_LIMIT - totalUses
      );

    const percent =
      Math.max(
        0,
        Math.min(
          100,
          (remaining / TOTAL_LIMIT) * 100
        )
      );

    const number =
      document.getElementById("usageNumber");

    const fill =
      document.getElementById("usageFill");

    if(number){
      number.textContent =
        remaining + " left";
    }

    if(fill){
      fill.style.width =
        percent + "%";
    }

    usageHeader.title =
      remaining +
      " total AI tool uses remaining.";

  }

  usageHeader.addEventListener("click", function(){

    const remaining =
      Math.max(
        0,
        TOTAL_LIMIT - totalUses
      );

    openModal(
      "📊 AI Tool Usage",
      `
        <div class="logic-answer">
          <strong>${remaining}</strong> total AI tool uses remaining.

          <br><br>

          Used: ${totalUses} / ${TOTAL_LIMIT}

          <br><br>

          Each individual AI tool also keeps its existing
          30-use limit and 5-minute lock system.
        </div>
      `
    );

  });

  headerActions.insertBefore(
    usageHeader,
    document.getElementById("themeButton")
  );

  updateUsageMeter();


  /* Count actual AI tool clicks without changing existing tool code */

  const aiToolList =
    document.querySelector(".ai-tools");

  if(aiToolList){

    aiToolList.addEventListener(
      "click",
      function(event){

        const button =
          event.target.closest(".ai-tool");

        if(!button){
          return;
        }

        const hasText =
          (
            currentChat &&
            currentChat.messages &&
            currentChat.messages.length
          ) ||
          input.value.trim();

        if(!hasText){
          return;
        }

        const toolName =
          button.dataset.tool || "";

        if(!toolName){
          return;
        }

        /* Count only if the tool is not currently locked */
        if(button.classList.contains("limit-locked")){
          return;
        }

        totalUses += 1;

        if(totalUses > TOTAL_LIMIT){
          totalUses = TOTAL_LIMIT;
        }

        localStorage.setItem(
          TOTAL_KEY,
          String(totalUses)
        );

        updateUsageMeter();

      },
      true
    );

  }


  /* ========================================================
     7. LANGUAGE SWITCHER
  ======================================================== */

  const LANGUAGES = [
    {
      code:"en",
      speech:"en-US",
      name:"English",
      flag:"🇬🇧"
    },
    {
      code:"ur",
      speech:"ur-PK",
      name:"اردو",
      flag:"🇵🇰"
    },
    {
      code:"ar",
      speech:"ar-SA",
      name:"العربية",
      flag:"🇸🇦"
    },
    {
      code:"hi",
      speech:"hi-IN",
      name:"हिन्दी",
      flag:"🇮🇳"
    },
    {
      code:"tr",
      speech:"tr-TR",
      name:"Türkçe",
      flag:"🇹🇷"
    },
    {
      code:"fr",
      speech:"fr-FR",
      name:"Français",
      flag:"🇫🇷"
    },
    {
      code:"es",
      speech:"es-ES",
      name:"Español",
      flag:"🇪🇸"
    },
    {
      code:"de",
      speech:"de-DE",
      name:"Deutsch",
      flag:"🇩🇪"
    },
    {
      code:"zh",
      speech:"zh-CN",
      name:"中文",
      flag:"🇨🇳"
    }
  ];

  const savedLanguage =
    localStorage.getItem(
      "simple_chat_language"
    ) || "en";

  let selectedLanguage =
    LANGUAGES.find(
      language =>
        language.code === savedLanguage
    ) || LANGUAGES[0];

  const languagePicker =
    document.createElement("div");

  languagePicker.className =
    "language-picker";

  const languageButton =
    document.createElement("button");

  languageButton.type = "button";
  languageButton.className =
    "language-button";

  languageButton.innerHTML = `
    <span class="language-flag"></span>
    <span class="language-name"></span>
    <span>▼</span>
  `;

  const languageMenu =
    document.createElement("div");

  languageMenu.className =
    "language-menu";

  languagePicker.appendChild(
    languageButton
  );

  languagePicker.appendChild(
    languageMenu
  );

  function renderLanguageButton(){

    languageButton.querySelector(
      ".language-flag"
    ).textContent =
      selectedLanguage.flag;

    languageButton.querySelector(
      ".language-name"
    ).textContent =
      selectedLanguage.name;

  }

  function renderLanguageMenu(){

    languageMenu.innerHTML = "";

    LANGUAGES.forEach(function(language){

      const option =
        document.createElement("button");

      option.type = "button";
      option.className =
        "language-option" +
        (
          language.code === selectedLanguage.code
            ? " active"
            : ""
        );

      option.innerHTML = `
        <span>${language.flag}</span>
        <span>${language.name}</span>
        <span>
          ${
            language.code === selectedLanguage.code
              ? "✓"
              : ""
          }
        </span>
      `;

      option.addEventListener(
        "click",
        function(event){

          event.stopPropagation();

          selectedLanguage =
            language;

          localStorage.setItem(
            "simple_chat_language",
            language.code
          );

          localStorage.setItem(
            "simple_chat_language_code",
            language.speech
          );

          renderLanguageButton();
          renderLanguageMenu();

          languagePicker.classList.remove(
            "open"
          );

          languageButton.setAttribute(
            "aria-expanded",
            "false"
          );

          toast(
            "Language changed to " +
            language.name + "."
          );

        }
      );

      languageMenu.appendChild(
        option
      );

    });

  }

  languageButton.addEventListener(
    "click",
    function(event){

      event.stopPropagation();

      const open =
        languagePicker.classList.toggle(
          "open"
        );

      languageButton.setAttribute(
        "aria-expanded",
        open ? "true" : "false"
      );

    }
  );

  document.addEventListener(
    "click",
    function(event){

      if(!languagePicker.contains(event.target)){

        languagePicker.classList.remove(
          "open"
        );

        languageButton.setAttribute(
          "aria-expanded",
          "false"
        );

      }

    }
  );

  headerActions.insertBefore(
    languagePicker,
    document.getElementById("themeButton")
  );

  renderLanguageButton();
  renderLanguageMenu();


  /* ========================================================
     ADD LANGUAGE INSTRUCTION TO AI REQUESTS
  ======================================================== */

  const previousLanguageFetch =
    window.fetch.bind(window);

  window.fetch = function(
    resource,
    options
  ){

    const url =
      typeof resource === "string"
        ? resource
        : ((resource && resource.url) || "");

    if(
      url.indexOf(
        "/netlify/functions/chat"
      ) !== -1 &&
      options &&
      typeof options.body === "string"
    ){

      try{

        const body =
          JSON.parse(options.body);

        const languageInstruction =
          selectedLanguage.code === "en"
            ? ""
            : "\n\nLANGUAGE PREFERENCE: " +
              "Answer the user in " +
              selectedLanguage.name +
              " unless the user specifically asks for another language.";

        body.systemPrompt =
          (body.systemPrompt || "") +
          languageInstruction;

        options =
          Object.assign(
            {},
            options,
            {
              body:
                JSON.stringify(body)
            }
          );

      }catch(error){
        /* Keep request unchanged if parsing fails */
      }

    }

    return previousLanguageFetch(
      resource,
      options
    );

  };


  /* ========================================================
     8. KEYBOARD SHORTCUTS HELP
  ======================================================== */

  const helpButton =
    document.createElement("button");

  helpButton.type = "button";
  helpButton.className =
    "extra-header-button";

  helpButton.id =
    "keyboardHelpButton";

  helpButton.title =
    "Keyboard shortcuts";

  helpButton.setAttribute(
    "aria-label",
    "Keyboard shortcuts"
  );

  helpButton.textContent = "❓";

  function showKeyboardHelp(){

    openModal(
      "❓ Keyboard Shortcuts",
      `
        <div class="shortcut-list">

          <div class="shortcut-row">
            <strong>Search Chats</strong>
            <span class="shortcut-key">Ctrl + K</span>
          </div>

          <div class="shortcut-row">
            <strong>Send message</strong>
            <span class="shortcut-key">Enter</span>
          </div>

          <div class="shortcut-row">
            <strong>New line</strong>
            <span class="shortcut-key">Shift + Enter</span>
          </div>

          <div class="shortcut-row">
            <strong>Close popup</strong>
            <span class="shortcut-key">Esc</span>
          </div>

          <div class="shortcut-row">
            <strong>New Chat</strong>
            <span class="shortcut-key">Header ➕</span>
          </div>

          <div class="shortcut-row">
            <strong>Search</strong>
            <span class="shortcut-key">Header 🔍</span>
          </div>

          <div class="shortcut-row">
            <strong>Share / Export</strong>
            <span class="shortcut-key">Header 📤</span>
          </div>

          <div class="shortcut-row">
            <strong>Auto-read</strong>
            <span class="shortcut-key">Header 🔊</span>
          </div>

        </div>
      `
    );

  }

  helpButton.addEventListener(
    "click",
    showKeyboardHelp
  );

  headerActions.insertBefore(
    helpButton,
    document.getElementById("themeButton")
  );


  /* ========================================================
     INITIAL STATUS / LANGUAGE
  ======================================================== */

  if(
    localStorage.getItem(
      "simple_chat_language_code"
    ) === null
  ){

    localStorage.setItem(
      "simple_chat_language_code",
      selectedLanguage.speech
    );

  }

  console.log(
    "Simple Chat AI enhancements loaded successfully."
  );

})();
</script>
</body>
