<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Simple Chat AI</title>
<style>
:root{--accent:#2563eb;--accent2:#7c3aed;--bg:#f3f6fb;--surface:#ffffff;--surface2:#f8fafc;--text:#172033;--muted:#64748b;--border:#dfe5ef;--danger:#ef4444;--success:#16a34a;--shadow:0 15px 45px rgba(15,23,42,.10);--left:285px;--right:300px;}
*{box-sizing:border-box;}
html,body{width:100%;height:100%;margin:0;}
body{font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;}
button,input,textarea,select{font:inherit;}
button{border:0;}
.app{width:100%;height:100vh;display:flex;flex-direction:column;}
/* HEADER */
.header{height:72px;min-height:72px;display:flex;align-items:center;gap:14px;padding:10px 18px;background:rgba(255,255,255,.92);border-bottom:1px solid var(--border);backdrop-filter:blur(18px);z-index:20;}
.header-left{display:flex;align-items:center;gap:12px;}
.menu-button,.header-button{width:44px;height:44px;border-radius:14px;background:var(--surface2);border:1px solid var(--border);color:var(--text);cursor:pointer;transition:.2s;}
.menu-button:hover,.header-button:hover{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.10);transform:translateY(-1px);}
.brand{display:flex;flex-direction:column;}
.brand h1{margin:0;font-size:19px;}
.status{display:flex;align-items:center;gap:6px;margin-top:2px;color:var(--muted);font-size:12px;}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 8px rgba(22,163,74,.6);}
.header-space{flex:1;}
.header-actions{display:flex;gap:8px;align-items:center;}
.profile{height:44px;padding:5px 12px 5px 5px;display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:15px;background:var(--surface2);cursor:pointer;}
.profile-avatar{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;}
/* MAIN */
.main{flex:1;min-height:0;display:flex;position:relative;}
/* SIDEBARS */
.sidebar{width:var(--left);min-width:var(--left);height:100%;background:rgba(255,255,255,.96);border-right:1px solid var(--border);transition:width .25s ease,min-width .25s ease,margin .25s ease,opacity .2s ease;overflow:hidden;z-index:10;}
.sidebar.closed{width:0;min-width:0;margin-left:0;opacity:0;border:0;}
.right-sidebar{width:var(--right);min-width:var(--right);height:100%;background:rgba(255,255,255,.96);border-left:1px solid var(--border);transition:width .25s ease,min-width .25s ease,margin .25s ease,opacity .2s ease;overflow:hidden;z-index:10;}
.right-sidebar.closed{width:0;min-width:0;opacity:0;border:0;}
.sidebar-inner{width:var(--left);height:100%;padding:14px;display:flex;flex-direction:column;}
.right-inner{width:var(--right);height:100%;padding:14px;display:flex;flex-direction:column;}
.sidebar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.sidebar-title{font-size:14px;font-weight:800;}
.close-button{width:36px;height:36px;border-radius:11px;background:var(--surface2);border:1px solid var(--border);cursor:pointer;color:var(--text);}
.close-button:hover{border-color:var(--accent);color:var(--accent);}
.section-label{color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin:8px 4px;}
.feature-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;overflow:auto;padding:3px;}
.feature-grid::-webkit-scrollbar{width:5px;}
.feature-grid::-webkit-scrollbar-thumb{background:#d4dbe7;border-radius:20px;}
/* FEATURE BUTTONS */
.feature{min-height:72px;padding:9px 6px;border-radius:15px;background:var(--surface2);border:1px solid var(--border);color:var(--text);cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;text-align:center;transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease,background .18s ease;}
.feature:hover{border-color:#2563eb;box-shadow:0 0 0 2px rgba(37,99,235,.11),0 7px 20px rgba(37,99,235,.08);background:#fff;transform:translateY(-2px);}
.feature:active{transform:translateY(0);}
.feature-icon{font-size:22px;}
.feature-name{font-size:11px;font-weight:700;}
/* RIGHT TOOLS */
.ai-tools{display:flex;flex-direction:column;gap:8px;overflow:auto;padding:3px;}
.ai-tools::-webkit-scrollbar{width:5px;}
.ai-tools::-webkit-scrollbar-thumb{background:#d4dbe7;border-radius:20px;}
.ai-tool{min-height:55px;padding:9px 11px;border-radius:14px;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;gap:11px;cursor:pointer;color:var(--text);text-align:left;transition:.18s;}
.ai-tool:hover{border-color:#2563eb;box-shadow:0 0 0 2px rgba(37,99,235,.10);transform:translateX(-2px);background:#fff;}
.ai-tool-icon{width:35px;height:35px;flex:none;display:grid;place-items:center;border-radius:10px;background:#eef4ff;font-size:18px;}
.ai-tool strong{display:block;font-size:12px;}
.ai-tool small{display:block;margin-top:2px;color:var(--muted);font-size:10px;}
/* OPEN BUTTONS */
.floating-open{position:absolute;top:14px;width:43px;height:43px;border-radius:13px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);cursor:pointer;z-index:15;display:none;place-items:center;font-size:19px;}
.floating-open:hover{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12),var(--shadow);}
.left-open{left:14px;}
.right-open{right:14px;}
.floating-open.show{display:grid;}
/* CHAT */
.chat-area{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;position:relative;}
.chat-header{height:52px;min-height:52px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--border);background:rgba(255,255,255,.55);}
.chat-title{font-size:13px;color:var(--muted);font-weight:700;}
.messages{flex:1;min-height:0;overflow-y:auto;padding:25px 7%;scroll-behavior:smooth;}
.empty{height:100%;display:flex;align-items:center;justify-content:center;}
.empty-card{width:min(580px,90%);text-align:center;}
.empty-logo{width:72px;height:72px;margin:auto;border-radius:23px;display:grid;place-items:center;color:#fff;font-size:32px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 15px 35px rgba(37,99,235,.25);}
.empty-card h2{margin:18px 0 7px;}
.empty-card p{margin:0;color:var(--muted);font-size:14px;}
.quick{margin-top:22px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.quick button{padding:13px;border:1px solid var(--border);border-radius:14px;background:var(--surface);cursor:pointer;transition:.18s;}
.quick button:hover{border-color:var(--accent);transform:translateY(-2px);}
/* MESSAGE */
.message{max-width:850px;margin:0 auto 18px;display:flex;gap:10px;}
.message.user{justify-content:flex-end;}
.message-bubble{max-width:78%;padding:13px 16px;border-radius:18px;line-height:1.55;font-size:14px;white-space:pre-wrap;}
.message.assistant .message-bubble{background:var(--surface);border:1px solid var(--border);}
.message.user .message-bubble{color:white;background:linear-gradient(135deg,var(--accent),var(--accent2));}
.message-time{font-size:9px;color:var(--muted);margin-top:5px;}
/* COMPOSER */
.composer{padding:12px max(18px,7%) 18px;background:linear-gradient(to top,rgba(243,246,251,1),rgba(243,246,251,.92));}
.composer-box{max-width:900px;margin:auto;min-height:62px;display:flex;align-items:flex-end;gap:8px;padding:8px;background:var(--surface);border:1px solid var(--border);border-radius:21px;box-shadow:var(--shadow);}
.composer-button{width:44px;height:44px;flex:none;border-radius:14px;border:1px solid var(--border);background:var(--surface2);cursor:pointer;color:var(--text);font-size:19px;transition:.18s;}
.composer-button:hover{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 2px rgba(37,99,235,.10);}
#input{flex:1;min-width:0;max-height:150px;min-height:44px;resize:none;outline:none;border:0;background:transparent;padding:12px 5px;color:var(--text);}
#input::placeholder{color:#94a3b8;}
/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(7px);display:none;align-items:center;justify-content:center;padding:20px;z-index:100;}
.modal-bg.show{display:flex;}
.modal{width:min(650px,100%);max-height:90vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:24px;box-shadow:0 30px 80px rgba(15,23,42,.25);}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border);}
.modal-head h2{margin:0;font-size:18px;}
.modal-body{padding:20px;}
.modal-close{width:36px;height:36px;border-radius:11px;background:var(--surface2);border:1px solid var(--border);cursor:pointer;font-size:20px;}
.option-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.option{padding:18px;border:1px solid var(--border);background:var(--surface2);border-radius:18px;text-align:left;cursor:pointer;transition:.18s;}
.option:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 10px 25px rgba(37,99,235,.10);}
.option-icon{font-size:28px;margin-bottom:10px;}
.option strong{display:block;font-size:14px;}
.option small{display:block;margin-top:5px;color:var(--muted);line-height:1.45;}
.logic-answer{padding:15px;background:var(--surface2);border:1px solid var(--border);border-radius:15px;line-height:1.6;white-space:pre-wrap;}
.form-group{margin-bottom:15px;}
.form-group label{display:block;margin-bottom:6px;font-size:12px;font-weight:800;}
.form-control{width:100%;padding:12px 13px;border:1px solid var(--border);border-radius:12px;outline:none;background:var(--surface2);color:var(--text);}
.form-control:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.10);}
.primary{width:100%;padding:12px 16px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;cursor:pointer;font-weight:800;}
.primary:hover{transform:translateY(-1px);box-shadow:0 10px 25px rgba(37,99,235,.20);}
.history-list{display:flex;flex-direction:column;gap:8px;}
.history-item{padding:13px;border:1px solid var(--border);border-radius:13px;background:var(--surface2);cursor:pointer;}
.history-item:hover{border-color:var(--accent);background:#fff;}
.history-item strong{display:block;font-size:13px;}
.history-item small{display:block;margin-top:3px;color:var(--muted);font-size:10px;}
/* TOAST */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);padding:11px 16px;border-radius:13px;background:#172033;color:white;font-size:12px;opacity:0;pointer-events:none;transition:.25s;z-index:200;box-shadow:0 15px 40px rgba(15,23,42,.25);}
.toast.show{opacity:1;transform:translate(-50%,0);}
/* DARK MODE */
body.dark{--bg:#0b1220;--surface:#111827;--surface2:#172033;--text:#f1f5f9;--muted:#94a3b8;--border:#263449;}
body.dark .header,body.dark .sidebar,body.dark .right-sidebar{background:rgba(17,24,39,.96);}
body.dark .chat-header{background:rgba(17,24,39,.55);}
body.dark .composer{background:linear-gradient(to top,rgba(11,18,32,1),rgba(11,18,32,.92));}
body.dark .feature:hover,body.dark .ai-tool:hover,body.dark .history-item:hover,body.dark .quick button{background:var(--surface);}
body.dark .ai-tool-icon{background:#1d2b46;}
/* MOBILE */
@media(max-width:1000px){:root{--left:255px;--right:270px;}}
@media(max-width:800px){
.sidebar,.right-sidebar{position:absolute;top:0;bottom:0;z-index:30;box-shadow:0 20px 60px rgba(15,23,42,.18);}
.sidebar{left:0;}
.right-sidebar{right:0;}
.sidebar.closed,.right-sidebar.closed{box-shadow:none;}
.floating-open{display:grid;}
.floating-open.show{display:grid;}
.header{padding:10px 12px;}
.header-actions{gap:5px;}
.profile{padding-right:7px;}
.profile span:last-child{display:none;}
.messages{padding:20px 14px;}
.composer{padding:10px 12px 14px;}
.quick{grid-template-columns:1fr;}
}
@media(max-width:520px){
.header-button{width:40px;height:40px;}
.brand h1{font-size:16px;}
.status{font-size:10px;}
.empty-card h2{font-size:21px;}
.message-bubble{max-width:90%;}
.option-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div class="app">

<!-- HEADER -->
<header class="header">
  <div class="header-left">
    <button class="menu-button" id="menuButton" title="Open workspace">☰</button>
    <div class="brand">
      <h1>Simple Chat AI</h1>
      <div class="status"><span class="status-dot"></span><span>AI Online</span></div>
    </div>
  </div>
  <div class="header-space"></div>
  <div class="header-actions">
    <button class="header-button" id="themeButton" title="Toggle theme">🌙</button>
    <button class="header-button" id="clearButton" title="Clear current chat">🗑️</button>
    <button class="profile" id="profileButton">
      <span class="profile-avatar">👤</span>
      <span>Profile</span>
    </button>
  </div>
</header>

<!-- MAIN -->
<main class="main">

  <!-- LEFT OPEN BUTTON -->
  <button class="floating-open left-open" id="leftOpenFloat" title="Open left sidebar">☰</button>

  <!-- LEFT SIDEBAR -->
  <aside class="sidebar" id="leftSidebar">
    <div class="sidebar-inner">
      <div class="sidebar-head">
        <span class="sidebar-title">Workspace</span>
        <button class="close-button" id="leftClose" title="Close sidebar">×</button>
      </div>
      <div class="section-label">Chat</div>
      <div class="feature-grid">
        <button class="feature" data-action="new"><span class="feature-icon">➕</span><span class="feature-name">New Chat</span></button>
        <button class="feature" data-action="history"><span class="feature-icon">🕘</span><span class="feature-name">Chat History</span></button>
        <button class="feature" data-action="favorites"><span class="feature-icon">⭐</span><span class="feature-name">Favorites</span></button>
        <button class="feature" data-action="saved"><span class="feature-icon">🔖</span><span class="feature-name">Saved Answers</span></button>
        <button class="feature" data-action="folders"><span class="feature-icon">📁</span><span class="feature-name">Chat Folders</span></button>
        <button class="feature" data-action="tags"><span class="feature-icon">🏷️</span><span class="feature-name">Chat Tags</span></button>
        <button class="feature" data-action="pinned"><span class="feature-icon">📌</span><span class="feature-name">Pinned</span></button>
        <button class="feature" data-action="autosave"><span class="feature-icon">💾</span><span class="feature-name">Auto Save</span></button>
        <button class="feature" data-action="stats"><span class="feature-icon">📊</span><span class="feature-name">Statistics</span></button>
        <button class="feature" data-action="memory"><span class="feature-icon">🧠</span><span class="feature-name">Memory</span></button>
        <button class="feature" data-action="profile"><span class="feature-icon">👤</span><span class="feature-name">Profile</span></button>
        <button class="feature" data-action="appearance"><span class="feature-icon">🎨</span><span class="feature-name">Appearance</span></button>
        <button class="feature" data-action="settings"><span class="feature-icon">⚙️</span><span class="feature-name">Settings</span></button>
        <button class="feature" data-action="privacy"><span class="feature-icon">🔒</span><span class="feature-name">Privacy</span></button>
        <button class="feature" data-action="export"><span class="feature-icon">📤</span><span class="feature-name">Export Chat</span></button>
      </div>
    </div>
  </aside>

  <!-- CENTER CHAT -->
  <section class="chat-area">
    <div class="chat-header"><span class="chat-title" id="chatTitle">New Chat</span></div>

    <div class="messages" id="messages">
      <div class="empty">
        <div class="empty-card">
          <div class="empty-logo">✦</div>
          <h2>How can I help you?</h2>
          <p>Ask anything, use an AI tool, or open Homework Helper with the + button.</p>
          <div class="quick">
            <button data-quick="Explain this topic simply">🧠 Explain something</button>
            <button data-quick="Summarize this for me">📝 Summarize</button>
            <button data-quick="Help me make a plan">📋 Make a plan</button>
            <button data-quick="Help me solve this problem step by step">💡 Solve a problem</button>
          </div>
        </div>
      </div>
    </div>

    <!-- COMPOSER -->
    <div class="composer">
      <div class="composer-box">
        <button class="composer-button" id="plusButton" title="Homework Helper and Logic">+</button>
        <textarea id="input" rows="1" placeholder="Ask Simple Chat AI anything..."></textarea>
        <button class="composer-button" id="voiceButton" title="Voice input">🎙️</button>
        <button class="composer-button" id="sendButton" title="Send">➤</button>
      </div>
    </div>
  </section>

  <!-- RIGHT OPEN BUTTON -->
  <button class="floating-open right-open" id="rightOpenFloat" title="Open AI tools">◧</button>

  <!-- RIGHT SIDEBAR -->
  <aside class="right-sidebar" id="rightSidebar">
    <div class="right-inner">
      <div class="sidebar-head">
        <span class="sidebar-title">AI Tools</span>
        <button class="close-button" id="rightClose" title="Close AI tools">×</button>
      </div>
      <div class="ai-tools">
        <button class="ai-tool" data-tool="Summarize"><span class="ai-tool-icon">📝</span><span><strong>Summarize</strong><small>Make text shorter</small></span></button>
        <button class="ai-tool" data-tool="Rewrite"><span class="ai-tool-icon">✍️</span><span><strong>Rewrite</strong><small>Rewrite your text</small></span></button>
        <button class="ai-tool" data-tool="Translate"><span class="ai-tool-icon">🌐</span><span><strong>Translate</strong><small>Translate text</small></span></button>
        <button class="ai-tool" data-tool="Explain"><span class="ai-tool-icon">🧠</span><span><strong>Explain</strong><small>Explain clearly</small></span></button>
        <button class="ai-tool" data-tool="Grammar Checker"><span class="ai-tool-icon">🔤</span><span><strong>Grammar Checker</strong><small>Fix grammar</small></span></button>
        <button class="ai-tool" data-tool="Improve Writing"><span class="ai-tool-icon">✨</span><span><strong>Improve Writing</strong><small>Make writing better</small></span></button>
        <button class="ai-tool" data-tool="Key Points"><span class="ai-tool-icon">🎯</span><span><strong>Key Points</strong><small>Extract important ideas</small></span></button>
        <button class="ai-tool" data-tool="Continue Response"><span class="ai-tool-icon">🔄</span><span><strong>Continue Response</strong><small>Continue an answer</small></span></button>
        <button class="ai-tool" data-tool="Email Writer"><span class="ai-tool-icon">📧</span><span><strong>Email Writer</strong><small>Write an email</small></span></button>
        <button class="ai-tool" data-tool="Outline Maker"><span class="ai-tool-icon">📋</span><span><strong>Outline Maker</strong><small>Create an outline</small></span></button>
        <button class="ai-tool" data-tool="Fact Checker"><span class="ai-tool-icon">🔎</span><span><strong>Fact Checker</strong><small>Check information</small></span></button>
        <button class="ai-tool" data-tool="Calculator"><span class="ai-tool-icon">🧮</span><span><strong>Calculator</strong><small>Calculate with AI</small></span></button>
        <button class="ai-tool" data-tool="Tone Changer"><span class="ai-tool-icon">🎭</span><span><strong>Tone Changer</strong><small>Change writing tone</small></span></button>
        <button class="ai-tool" data-tool="Compare"><span class="ai-tool-icon">⚖️</span><span><strong>Compare</strong><small>Compare two things</small></span></button>
        <button class="ai-tool" data-tool="Ask About Text"><span class="ai-tool-icon">💡</span><span><strong>Ask About Text</strong><small>Ask AI about text</small></span></button>

        <!-- 22 NEW AI TOOLS -->
        <button class="ai-tool" data-tool="Brainstorm Ideas"><span class="ai-tool-icon">💭</span><span><strong>Brainstorm Ideas</strong><small>Generate creative ideas</small></span></button>
        <button class="ai-tool" data-tool="Make It Shorter"><span class="ai-tool-icon">✂️</span><span><strong>Make It Shorter</strong><small>Shorten the text</small></span></button>
        <button class="ai-tool" data-tool="Make It Longer"><span class="ai-tool-icon">➕</span><span><strong>Make It Longer</strong><small>Expand the text</small></span></button>
        <button class="ai-tool" data-tool="Simplify Text"><span class="ai-tool-icon">🪄</span><span><strong>Simplify Text</strong><small>Use easier words</small></span></button>
        <button class="ai-tool" data-tool="Make It Professional"><span class="ai-tool-icon">💼</span><span><strong>Make It Professional</strong><small>Use a professional style</small></span></button>
        <button class="ai-tool" data-tool="Make It Friendly"><span class="ai-tool-icon">😊</span><span><strong>Make It Friendly</strong><small>Make it warm and friendly</small></span></button>
        <button class="ai-tool" data-tool="Generate Questions"><span class="ai-tool-icon">❓</span><span><strong>Generate Questions</strong><small>Create useful questions</small></span></button>
        <button class="ai-tool" data-tool="Answer Questions"><span class="ai-tool-icon">💬</span><span><strong>Answer Questions</strong><small>Answer questions clearly</small></span></button>
        <button class="ai-tool" data-tool="Create Examples"><span class="ai-tool-icon">🧩</span><span><strong>Create Examples</strong><small>Give helpful examples</small></span></button>
        <button class="ai-tool" data-tool="Give Pros & Cons"><span class="ai-tool-icon">⚖️</span><span><strong>Give Pros &amp; Cons</strong><small>Show advantages and disadvantages</small></span></button>
        <button class="ai-tool" data-tool="Summarize in One Line"><span class="ai-tool-icon">1️⃣</span><span><strong>Summarize in One Line</strong><small>Make a one-line summary</small></span></button>
        <button class="ai-tool" data-tool="Create a Checklist"><span class="ai-tool-icon">☑️</span><span><strong>Create a Checklist</strong><small>Turn ideas into a checklist</small></span></button>
        <button class="ai-tool" data-tool="Create a Table"><span class="ai-tool-icon">📊</span><span><strong>Create a Table</strong><small>Organize information in a table</small></span></button>
        <button class="ai-tool" data-tool="Create Flashcards"><span class="ai-tool-icon">🃏</span><span><strong>Create Flashcards</strong><small>Make question and answer cards</small></span></button>

<!-- MODAL -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle">Tool</h2>
      <button class="modal-close" id="modalClose">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* BASIC HELPERS */
const $ = selector => document.querySelector(selector);
const $$ = selector => Array.from(document.querySelectorAll(selector));

const messagesEl = $("#messages");
const input = $("#input");

let chats = JSON.parse(localStorage.getItem("simple_chat_chats") || "[]");
let currentChat = JSON.parse(localStorage.getItem("simple_chat_current") || "null");
let listening = false;

/* STORAGE */
function saveChats(){
  localStorage.setItem("simple_chat_chats", JSON.stringify(chats));
  localStorage.setItem("simple_chat_current", JSON.stringify(currentChat));
}

function makeChat(){
  return {
    id: Date.now().toString(),
    title: "New Chat",
    created: new Date().toISOString(),
    messages:[]
  };
}

function ensureChat(){
  if(!currentChat){
    currentChat = makeChat();
    chats.unshift(currentChat);
    saveChats();
  }
  return currentChat;
}

/* TOAST */
let toastTimer;
function toast(message){
  const el = $("#toast");
  el.textContent = message;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
}

/* MODAL */
function openModal(title, html){
  $("#modalTitle").textContent = title;
  $("#modalBody").innerHTML = html;
  $("#modalBg").classList.add("show");
}

function closeModal(){
  $("#modalBg").classList.remove("show");
}

$("#modalClose").addEventListener("click", closeModal);

$("#modalBg").addEventListener("click", function(event){
  if(event.target === this){
    closeModal();
  }
});

/* SIDEBARS */
const leftSidebar = $("#leftSidebar");
const rightSidebar = $("#rightSidebar");
const leftOpenFloat = $("#leftOpenFloat");
const rightOpenFloat = $("#rightOpenFloat");

$("#menuButton").addEventListener("click", function(){
  leftSidebar.classList.toggle("closed");
  leftOpenFloat.classList.toggle("show", leftSidebar.classList.contains("closed"));
});

$("#leftClose").addEventListener("click", function(){
  leftSidebar.classList.add("closed");
  leftOpenFloat.classList.add("show");
});

leftOpenFloat.addEventListener("click", function(){
  leftSidebar.classList.remove("closed");
  leftOpenFloat.classList.remove("show");
});

$("#rightClose").addEventListener("click", function(){
  rightSidebar.classList.add("closed");
  rightOpenFloat.classList.add("show");
});

rightOpenFloat.addEventListener("click", function(){
  rightSidebar.classList.remove("closed");
  rightOpenFloat.classList.remove("show");
});

/* THEME */
$("#themeButton").addEventListener("click", function(){
  document.body.classList.toggle("dark");
  const dark = document.body.classList.contains("dark");
  localStorage.setItem("simple_chat_theme", dark ? "dark" : "light");
  this.textContent = dark ? "☀️" : "🌙";
});

if(localStorage.getItem("simple_chat_theme") === "dark"){
  document.body.classList.add("dark");
  $("#themeButton").textContent = "☀️";
}

/* RENDER */
function render(){
  ensureChat();
  $("#chatTitle").textContent = currentChat.title || "New Chat";

  if(!currentChat.messages.length){
    messagesEl.innerHTML = `
      <div class="empty">
        <div class="empty-card">
          <div class="empty-logo">✦</div>
          <h2>How can I help you?</h2>
          <p>Ask anything, use an AI tool, or open Homework Helper with the + button.</p>
          <div class="quick">
            <button data-quick="Explain this topic simply">🧠 Explain something</button>
            <button data-quick="Summarize this for me">📝 Summarize</button>
            <button data-quick="Help me make a plan">📋 Make a plan</button>
            <button data-quick="Help me solve this problem step by step">💡 Solve a problem</button>
          </div>
        </div>
      </div>
    `;

    $$(".quick button").forEach(button => {
      button.addEventListener("click", function(){
        input.value = this.dataset.quick;
        autoResize();
        input.focus();
      });
    });

    return;
  }

  messagesEl.innerHTML = currentChat.messages
    .map(message => {
      return `
        <div class="message ${message.role}">
          <div>
            <div class="message-bubble">${escapeHTML(message.content)}</div>
            <div class="message-time">${message.role === "user" ? "You" : "AI"}</div>
          </div>
        </div>
      `;
    })
    .join("");

  messagesEl.scrollTop = messagesEl.scrollHeight;
}

/* SEND MESSAGE */
async function sendMessage(){
  const text = input.value.trim();
  if(!text){
    return;
  }

  ensureChat();
  currentChat.messages.push({ role:"user", content:text });

  if(currentChat.title === "New Chat"){
    currentChat.title = text.length > 35 ? text.slice(0,35) + "..." : text;
  }

  input.value = "";
  autoResize();
  saveChats();
  render();
  await askAI(text);
}

async function askAI(text){
  const typing = document.createElement("div");
  typing.className = "message assistant";
  typing.id = "typingMessage";
  typing.innerHTML = `<div class="message-bubble">Thinking...</div>`;
  messagesEl.appendChild(typing);
  messagesEl.scrollTop = messagesEl.scrollHeight;

  try{
    const history = currentChat.messages
      .slice(-30)
      .map(item => ({ role:item.role, content:item.content }));

    const response = await fetch("/netlify/functions/chat", {
      method:"POST",
      headers:{ "Content-Type": "application/json" },
      body:JSON.stringify({
        message:text,
        history:history,
        systemPrompt: "You are Simple Chat AI. Be helpful, accurate and clear."
      })
    });

    const data = await response.json();

    if(!response.ok){
      throw new Error(data.error || "AI request failed.");
    }

    const reply = typeof data.reply === "string" ? data.reply : "The AI returned no answer.";

    currentChat.messages.push({ role:"assistant", content:reply });
    saveChats();
    render();
  }catch(error){
    console.error(error);
    currentChat.messages.push({
      role:"assistant",
      content: "⚠️ " + (error.message || "Could not connect to the AI.")
    });
    saveChats();
    render();
  }
}

/* INPUT */
function autoResize(){
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 150) + "px";
}

input.addEventListener("input", autoResize);

input.addEventListener("keydown", function(event){
  if(event.key === "Enter" && !event.shiftKey){
    event.preventDefault();
    sendMessage();
  }
});

$("#sendButton").addEventListener("click", sendMessage);

/* HOMEWORK + LOGIC */
$("#plusButton").addEventListener("click", showHomeworkMenu);

function showHomeworkMenu(){
  openModal("Homework & Logic", `
    <div class="option-grid">
      <button class="option" id="homeworkOption">
        <div class="option-icon">📚</div>
        <strong>Homework Helper</strong>
        <small>Choose a subject and send your question directly to AI.</small>
      </button>
      <button class="option" id="logicOption">
        <div class="option-icon">🧠</div>
        <strong>Logic</strong>
        <small>Ask a logic question and receive an AI answer below it.</small>
      </button>
    </div>
  `);

  $("#homeworkOption").addEventListener("click", function(){
    openHomeworkHelper();
  });

  $("#logicOption").addEventListener("click", function(){
    openLogicTool();
  });
}

function openHomeworkHelper(){
  openModal("📚 Homework Helper", `
    <div class="form-group">
      <label>Subject</label>
      <select class="form-control" id="homeworkSubject">
        <option>Math</option>
        <option>Science</option>
        <option>English</option>
        <option>History</option>
        <option>Geography</option>
        <option>Computer Science</option>
        <option>Other</option>
      </select>
    </div>
    <div class="form-group">
      <label>Your Question</label>
      <textarea class="form-control" id="homeworkQuestion" rows="5" placeholder="Type your homework question..."></textarea>
    </div>
    <button class="primary" id="sendHomework">Ask AI</button>
  `);

  $("#sendHomework").addEventListener("click", async function(){
    const subject = $("#homeworkSubject").value;
    const question = $("#homeworkQuestion").value.trim();

    if(!question){
      toast("Please enter your homework question.");
      return;
    }

    closeModal();
    input.value = "Homework Helper — " + subject + ":\n\n" + question;

function openLogicTool(){
  openModal("🧠 Logic", `
    <div class="form-group">
      <label>Logic Question</label>
      <textarea class="form-control" id="logicQuestion" rows="5" placeholder="Type your logic question..."></textarea>
    </div>
    <button class="primary" id="askLogic">Ask AI</button>
  `);

  $("#askLogic").addEventListener("click", async function(){
    const question = $("#logicQuestion").value.trim();

    if(!question){
      toast("Please enter a logic question.");
      return;
    }

    closeModal();
    input.value = "Logic question:\n\n" + question;
    autoResize();
    await sendMessage();
  });
}

/* LEFT FEATURES */
$$(".feature").forEach(button => {
  button.addEventListener("click", function(){
    handleFeature(this.dataset.action);
  });
});

function handleFeature(action){
  if(action === "new"){
    currentChat = makeChat();
    chats.unshift(currentChat);
    saveChats();
    render();
    toast("New chat created.");
    return;
  }

  if(action === "history"){
    showHistory();
    return;
  }

  if(action === "profile"){
    openProfile();
    return;
  }

  if(action === "appearance"){
    showSimpleFeature("🎨 Appearance", "Use the moon button in the header to switch between light and dark mode.");
    return;
  }

  if(action === "settings"){
    showSimpleFeature("⚙️ Settings", "Simple Chat AI settings are available here.");
    return;
  }

  if(action === "privacy"){
    showSimpleFeature("🔒 Privacy", "Temporary chats and local chat storage controls.");
    return;
  }

  if(action === "export"){
    exportChat();
    return;
  }

  if(action === "stats"){
    const count = currentChat ? currentChat.messages.length : 0;
    showSimpleFeature("📊 Chat Statistics", "Messages in this conversation: " + count);
    return;
  }

  if(action === "saved"){
    showSimpleFeature("🔖 Saved Answers", "Saved answers will appear here.");
    return;
  }

  if(action === "memory"){
    showSimpleFeature("🧠 Memory", "Memory workspace for useful conversation information.");
    return;
  }

  showSimpleFeature(
    "✨ " + action.charAt(0).toUpperCase() + action.slice(1),
    "This workspace feature is ready for your chat."
  );
}

function showSimpleFeature(title, text){
  openModal(title, `<div class="logic-answer" style="margin-top:0">${text}</div>`);
}

/* HISTORY */
function showHistory(){
  let html = `<div class="history-list">`;

  if(!chats.length){
    html += `<div class="logic-answer">No previous chats yet.</div>`;
  }else{
    chats.slice(0,30).forEach(chat => {
      html += `
        <div class="history-item" data-chat-id="${chat.id}">
          <strong>${escapeHTML(chat.title)}</strong>
          <small>${chat.messages.length} messages</small>
        </div>
      `;
    });
  }

  html += "</div>";
  openModal("🕘 Chat History", html);

  $$(".history-item").forEach(item => {
    item.addEventListener("click", function(){
      const chat = chats.find(c => c.id === this.dataset.chatId);
      if(chat){
        currentChat = chat;
        saveChats();
        closeModal();
        render();
        toast("Chat opened.");
      }
    });
  });
}

/* AI TOOLS */
$$(".ai-tool").forEach(button => {
  button.addEventListener("click", function(){
    useAITool(this.dataset.tool);

});

/* CLEAR */
$("#clearButton").addEventListener("click", function(){
  if(!currentChat){
    return;
  }
  currentChat.messages = [];
  saveChats();
  render();
  toast("Chat cleared.");
});

/* EXPORT */
function exportChat(){
  ensureChat();

  let text = "Simple Chat AI\n\n";

  currentChat.messages.forEach(message => {
    text += message.role.toUpperCase() + ":\n" + message.content + "\n\n";
  });

  const blob = new Blob([text], {type:"text/plain"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "simple-chat-ai.txt";
  a.click();
  URL.revokeObjectURL(url);
  toast("Chat exported.");
}

/* ESCAPE HTML */
function escapeHTML(value){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

/* VOICE INPUT */
$("#voiceButton").addEventListener("click", function(){
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if(!SpeechRecognition){
    toast("Voice input is not supported in this browser.");
    return;
  }

  if(listening){
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "en-US";
  recognition.interimResults = true;
  recognition.continuous = false;

  listening = true;
  $("#voiceButton").textContent = "🔴";

  recognition.onresult = function(event){
    let text = "";
    for(let i = event.resultIndex; i < event.results.length; i++){
      text += event.results[i][0].transcript;
    }
    input.value = text;
    autoResize();
  };

  recognition.onerror = function(){
    toast("Voice input could not start.");
  };

  recognition.onend = function(){
    listening = false;
    $("#voiceButton").textContent = "🎙️";
  };

  recognition.start();
});

/* =========================
   PROFILE
========================= */
const PROFILE_KEYS = {
  name:"simple_chat_profile_name",
  email:"simple_chat_profile_email",
  photo:"simple_chat_profile_photo"
};

let cameraStream = null;

function stopCamera(){
  if(cameraStream){
    cameraStream.getTracks().forEach(track => track.stop());
    cameraStream = null;
  }
}

/* Turn the camera off whenever the modal closes */
new MutationObserver(function(){
  if(!$("#modalBg").classList.contains("show")){
    stopCamera();
  }
}).observe($("#modalBg"), { attributes:true, attributeFilter:["class"] });

function updateHeaderAvatar(){
  const el = document.querySelector(".profile-avatar");
  const photo = localStorage.getItem(PROFILE_KEYS.photo);

  if(photo){
    el.textContent = "";
    el.style.backgroundImage = 'url("' + photo + '")';
    el.style.backgroundSize = "cover";
    el.style.backgroundPosition = "center";
  }else{
    el.textContent = "👤";
    el.style.backgroundImage = "";
  }
}

function toSquareDataURL(source, sourceWidth, sourceHeight){
  const size = 256;
  const canvas = document.createElement("canvas");
  canvas.width = size;
  canvas.height = size;

  const side = Math.min(sourceWidth, sourceHeight);
  const sx = (sourceWidth - side) / 2;
  const sy = (sourceHeight - side) / 2;

  canvas.getContext("2d").drawImage(source, sx, sy, side, side, 0, 0, size, size);

  return canvas.toDataURL("image/jpeg", 0.85);
}

function openProfile(){
  let photo = localStorage.getItem(PROFILE_KEYS.photo) || "";

  openModal(
    "👤 Profile",
    `
      <div style="display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:18px">
        <div id="profilePhotoPreview" style="width:110px;height:110px;border-radius:50%;display:grid;place-items:center;font-size:44px;color:#fff;overflow:hidden;background:linear-gradient(135deg,var(--accent),var(--accent2));background-size:cover;background-position:center"></div>

        <video id="profileVideo" autoplay playsinline muted style="display:none;width:100%;max-width:320px;border-radius:16px;background:#000"></video>

        <div id="photoActions" style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
          <button class="option" id="takePhotoBtn" style="padding:10px 14px">📷 Take Photo</button>
          <button class="option" id="choosePhotoBtn" style="padding:10px 14px">🖼️ Choose from Files</button>
          <button class="option" id="removePhotoBtn" style="padding:10px 14px">🗑️ Remove</button>
        </div>

        <div id="cameraActions" style="display:none;gap:8px;justify-content:center">
          <button class="option" id="capturePhotoBtn" style="padding:10px 14px">📸 Capture</button>
          <button class="option" id="cancelCameraBtn" style="padding:10px 14px">Cancel</button>
        </div>

        <input type="file" id="photoFileInput" accept="image/*" hidden>
        <input type="file" id="photoCaptureInput" accept="image/*" capture="user" hidden>
      </div>

      <div class="form-group">
        <label>Your Name</label>
        <input class="form-control" id="profileName" placeholder="Enter your name">
      </div>

      <div class="form-group">
        <label>Your Email</label>
        <input class="form-control" id="profileEmail" type="email" placeholder="Enter your email">
      </div>

      <button class="primary" id="saveProfile">Save Profile</button>
    `
  );

  const preview = $("#profilePhotoPreview");
  const video = $("#profileVideo");
  const photoActions = $("#photoActions");
  const cameraActions = $("#cameraActions");

  $("#profileName").value = localStorage.getItem(PROFILE_KEYS.name) || "";
  $("#profileEmail").value = localStorage.getItem(PROFILE_KEYS.email) || "";

  function showPhoto(){
    if(photo){
      preview.textContent = "";
      preview.style.backgroundImage = 'url("' + photo + '")';
    }else{
      preview.textContent = "👤";
      preview.style.backgroundImage = "";
    }
  }

  function closeCameraView(){
    stopCamera();
    video.srcObject = null;
    video.style.display = "none";
    cameraActions.style.display = "none";
    preview.style.display = "grid";
    photoActions.style.display = "flex";
  }

  function loadImageFile(file){
    if(!file){
      return;
    }

    if(!file.type.startsWith("image/")){
      toast("Please choose an image file.");
      return;
    }

    const url = URL.createObjectURL(file);
    const img = new Image();

    img.onload = function(){
      photo = toSquareDataURL(img, img.naturalWidth, img.naturalHeight);
      URL.revokeObjectURL(url);
      showPhoto();
      toast("Photo selected. Press Save Profile.");
    };

    img.onerror = function(){
      URL.revokeObjectURL(url);
      toast("Could not read that image.");
    };

    img.src = url;
  }

  /* Take photo with the camera */
  $("#takePhotoBtn").addEventListener("click", async function(){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      $("#photoCaptureInput").click();
      return;
    }

    try{
      cameraStream = await navigator.mediaDevices.getUserMedia({
        video:{ facingMode:"user" },
        audio:false
      });

      video.srcObject = cameraStream;
      preview.style.display = "none";
      video.style.display = "block";
      photoActions.style.display = "none";
      cameraActions.style.display = "flex";
    }catch(error){
      console.error(error);
      toast("Could not access the camera. Check the permission.");
    }
  });

  $("#capturePhotoBtn").addEventListener("click", function(){
    if(!video.videoWidth){
      toast("Camera is not ready yet.");
      return;
    }

    photo = toSquareDataURL(video, video.videoWidth, video.videoHeight);
    closeCameraView();
    showPhoto();
    toast("Photo taken. Press Save Profile.");
  });

  });

  $("#photoFileInput").addEventListener("change", function(){
    loadImageFile(this.files && this.files[0]);
    this.value = "";
  });

  $("#photoCaptureInput").addEventListener("change", function(){
    loadImageFile(this.files && this.files[0]);
    this.value = "";
  });

  $("#removePhotoBtn").addEventListener("click", function(){
    photo = "";
    showPhoto();
  });

  /* Save */
  $("#saveProfile").addEventListener("click", function(){
    const name = $("#profileName").value.trim();
    const email = $("#profileEmail").value.trim();

    if(email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
      toast("Please enter a valid email address.");
      return;
    }

    try{
      localStorage.setItem(PROFILE_KEYS.name, name);
      localStorage.setItem(PROFILE_KEYS.email, email);

      if(photo){
        localStorage.setItem(PROFILE_KEYS.photo, photo);
      }else{
        localStorage.removeItem(PROFILE_KEYS.photo);
      }
    }catch(error){
      console.error(error);
      toast("Could not save the profile. Storage may be full.");
      return;
    }

    updateHeaderAvatar();
    closeModal();
    toast(name || email || photo ? "Profile saved." : "Profile cleared.");
  });

  showPhoto();
}

$("#profileButton").addEventListener("click", openProfile);

updateHeaderAvatar();

ensureChat();
render();
console.log("Simple Chat AI loaded successfully.");

<script>
"use strict";

/* ==========================================================
   FIVE NEW FEATURES (added separately, existing code untouched)
   1. Search Chats   2. Rename Chat   3. Delete Chats
   4. Read Aloud     5. Font Size
========================================================== */
(function(){

  /* ---------- 1. SEARCH CHATS ---------- */
  function searchChats(){
    openModal("🔍 Search Chats", `
      <div class="form-group">
        <label>Search titles and messages</label>
        <input class="form-control" id="searchChatInput" placeholder="Type to search...">
      </div>
      <div class="history-list" id="searchChatResults"></div>
    `);

    const box = $("#searchChatInput");
    const results = $("#searchChatResults");

    function run(){
      const q = box.value.trim().toLowerCase();

      if(!q){
        results.innerHTML = `<div class="logic-answer">Type something to search your chats.</div>`;
        return;
      }

      const found = chats.filter(chat =>
        (chat.title || "").toLowerCase().includes(q) ||
        chat.messages.some(m => String(m.content).toLowerCase().includes(q))
      );

      if(!found.length){
        results.innerHTML = `<div class="logic-answer">No chats found.</div>`;
        return;
      }

      results.innerHTML = found.slice(0,30).map(chat => `
        <div class="history-item" data-search-id="${chat.id}">
          <strong>${escapeHTML(chat.title)}</strong>
          <small>${chat.messages.length} messages</small>
        </div>
      `).join("");

      results.querySelectorAll(".history-item").forEach(item => {
        item.addEventListener("click", function(){
          const chat = chats.find(c => c.id === this.dataset.searchId);
          if(chat){
            currentChat = chat;
            saveChats();
            closeModal();
            render();
            toast("Chat opened.");
          }
        });
      });
    }

    box.addEventListener("input", run);
    run();
    box.focus();
  }

  /* ---------- 2. RENAME CHAT ---------- */
  function renameChat(){
    ensureChat();

    openModal("✏️ Rename Chat", `
      <div class="form-group">
        <label>Chat Title</label>
        <input class="form-control" id="renameChatInput" maxlength="80" placeholder="Enter a new title">
      </div>
      <button class="primary" id="renameChatSave">Save Title</button>
    `);

    const box = $("#renameChatInput");
    box.value = currentChat.title || "";
    box.focus();
    box.select();

    function save(){
      const title = box.value.trim();

      if(!title){
        toast("Please enter a title.");
        return;
      }

      currentChat.title = title;

      const stored = chats.find(c => c.id === currentChat.id);
      if(stored){
        stored.title = title;
      }

      saveChats();
      closeModal();
      render();
      toast("Chat renamed.");
    }

    $("#renameChatSave").addEventListener("click", save);
    box.addEventListener("keydown", function(event){
      if(event.key === "Enter"){
        save();
      }
    });
  }

  /* ---------- 3. DELETE CHATS ---------- */
  function deleteChats(){
    function draw(){
      if(!chats.length){
        openModal("🗑️ Delete Chats", `<div class="logic-answer">No chats to delete.</div>`);
        return;
      }

      openModal("🗑️ Delete Chats", `
        <div class="history-list">
          ${chats.slice(0,50).map(chat => `
            <div class="history-item" style="display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:default">
              <div style="min-width:0">
                <strong>${escapeHTML(chat.title)}</strong>
                <small>${chat.messages.length} messages</small>
              </div>
              <button class="modal-close" data-delete-id="${chat.id}" title="Delete this chat" style="flex:none;color:var(--danger)">🗑️</button>
            </div>
          `).join("")}
        </div>
        <button class="primary" id="deleteAllChats" style="margin-top:14px;background:var(--danger)">Delete All Chats</button>
      `);

      $$("[data-delete-id]").forEach(button => {
        button.addEventListener("click", function(){
          const id = this.dataset.deleteId;
          chats = chats.filter(c => c.id !== id);

          if(currentChat && currentChat.id === id){
            currentChat = chats[0] || null;
          }

          saveChats();
          render();
          toast("Chat deleted.");
          draw();
        });
      });

      $("#deleteAllChats").addEventListener("click", function(){
        if(!confirm("Delete all chats? This cannot be undone.")){
          return;
        }

        chats = [];
        currentChat = null;
        saveChats();
        render();
        closeModal();
        toast("All chats deleted.");
      });
    }

    draw();
  }

  /* ---------- 4. READ ALOUD ---------- */
  function readAloud(){
    if(!("speechSynthesis" in window)){
      toast("Read aloud is not supported in this browser.");
      return;
    }

    if(window.speechSynthesis.speaking){
      window.speechSynthesis.cancel();
      toast("Stopped reading.");
      return;
    }

    const messages = currentChat ? currentChat.messages : [];
    let last = null;

    for(let i = messages.length - 1; i >= 0; i--){
      if(messages[i].role === "assistant" && !String(messages[i].content).startsWith("⚠️")){
        last = messages[i];
        break;
      }
    }

    if(!last){
      toast("No AI answer to read yet.");
      return;
    }

    const speech = new SpeechSynthesisUtterance(last.content);
    speech.lang = "en-US";
    speech.onend = function(){ toast("Finished reading."); };
    speech.onerror = function(){ toast("Could not read the answer."); };

    window.speechSynthesis.speak(speech);
    toast("Reading the last answer. Tap again to stop.");
  }

  /* ---------- 5. FONT SIZE ---------- */
  const fontStyle = document.createElement("style");
  document.head.appendChild(fontStyle);

  function applyFontSize(size){
    fontStyle.textContent = ".message-bubble{font-size:" + size + "px !important;}";
  }

  function fontSize(){
    const saved = parseInt(localStorage.getItem("simple_chat_font_size") || "14", 10);

    openModal("🔠 Font Size", `
      <div class="form-group">
        <label>Message text size: <span id="fontSizeValue">${saved}</span>px</label>
        <input type="range" id="fontSizeRange" min="12" max="22" step="1" value="${saved}" style="width:100%">
      </div>
      <div class="logic-answer" id="fontSizePreview" style="font-size:${saved}px">This is how your chat messages will look.</div>
      <button class="primary" id="fontSizeReset" style="margin-top:14px">Reset to Default</button>
    `);

    const range = $("#fontSizeRange");

    function update(size){
      $("#fontSizeValue").textContent = size;
      $("#fontSizePreview").style.fontSize = size + "px";
      applyFontSize(size);
      localStorage.setItem("simple_chat_font_size", String(size));
    }

    range.addEventListener("input", function(){
      update(parseInt(this.value, 10));
    });

    $("#fontSizeReset").addEventListener("click", function(){
      range.value = 14;
      update(14);
      toast("Font size reset.");
    });
  }

  applyFontSize(parseInt(localStorage.getItem("simple_chat_font_size") || "14", 10));

  /* ---------- ADD BUTTONS TO LEFT SIDEBAR ---------- */
  const grid = document.querySelector(".feature-grid");

  [
    { icon:"🔍", name:"Search Chats", run:searchChats },
    { icon:"✏️", name:"Rename Chat",  run:renameChat },
    { icon:"🗑️", name:"Delete Chats", run:deleteChats },
    { icon:"🔊", name:"Read Aloud",   run:readAloud },
    { icon:"🔠", name:"Font Size",    run:fontSize }
  ].forEach(item => {
    const button = document.createElement("button");
    button.className = "feature";
    button.innerHTML =
      '<span class="feature-icon">' + item.icon + '</span>' +
      '<span class="feature-name">' + item.name + '</span>';
    button.addEventListener("click", item.run);
    grid.appendChild(button);
  });

})();
</script>
<script>
"use strict";

/* ==========================================================
   FIVE MORE FEATURES (added separately, existing code untouched)
   1. Copy Last Answer   2. Regenerate Answer   3. Import / Export JSON
   4. Word Count         5. Accent Color
========================================================== */
(function(){

  /* ---------- 1. COPY LAST ANSWER ---------- */
  function lastAssistantMessage(){
    const messages = currentChat ? currentChat.messages : [];
    for(let i = messages.length - 1; i >= 0; i--){
      if(messages[i].role === "assistant" && !String(messages[i].content).startsWith("⚠️")){
        return messages[i];
      }
    }
    return null;
  }

  function copyText(text){
    if(navigator.clipboard && window.isSecureContext){
      return navigator.clipboard.writeText(text);
    }

    return new Promise(function(resolve, reject){
      const area = document.createElement("textarea");
      area.value = text;
      area.style.position = "fixed";
      area.style.opacity = "0";
      document.body.appendChild(area);
      area.select();

      try{
        document.execCommand("copy") ? resolve() : reject();
      }catch(error){
        reject(error);
      }

      document.body.removeChild(area);
    });
  }

  function copyLastAnswer(){
    const last = lastAssistantMessage();

    if(!last){
      toast("No AI answer to copy yet.");
      return;
    }

    copyText(last.content)
      .then(function(){ toast("Answer copied."); })
      .catch(function(){ toast("Could not copy the answer."); });
  }

  /* ---------- 2. REGENERATE ANSWER ---------- */
  let regenerating = false;

  async function regenerateAnswer(){
    if(regenerating){
      return;
    }

    ensureChat();
    const messages = currentChat.messages;

    let lastUserIndex = -1;
    for(let i = messages.length - 1; i >= 0; i--){
      if(messages[i].role === "user"){
        lastUserIndex = i;
        break;
      }
    }

    if(lastUserIndex === -1){
      toast("Send a message first.");
      return;
    }

    const text = messages[lastUserIndex].content;

    currentChat.messages = messages.slice(0, lastUserIndex + 1);
    saveChats();
    render();

    regenerating = true;
    toast("Regenerating answer...");

    try{
      await askAI(text);
    }finally{
      regenerating = false;
    }
  }

  /* ---------- 3. IMPORT / EXPORT JSON ---------- */
  function cleanMessages(list){
    if(!Array.isArray(list)){
      return [];
    }

    return list
      .filter(m => m && (m.role === "user" || m.role === "assistant") && typeof m.content === "string")
      .map(m => ({ role:m.role, content:m.content }));
  }

  function importExport(){
    openModal("📥 Import / Export JSON", `
      <div class="form-group">
        <label>Import a chat (.json)</label>
        <input class="form-control" type="file" id="importChatFile" accept=".json,application/json">
      </div>
      <button class="primary" id="exportJsonButton">Export Current Chat as JSON</button>
    `);

    $("#importChatFile").addEventListener("change", function(){
      const file = this.files && this.files[0];

      if(!file){
        return;
      }

      const reader = new FileReader();

      reader.onload = function(){
        try{
          const data = JSON.parse(reader.result);
          const list = Array.isArray(data) ? data : data.messages;
          const messages = cleanMessages(list);

          if(!messages.length){
            toast("No valid messages found in that file.");
            return;
          }

          const chat = makeChat();
          chat.title = (!Array.isArray(data) && typeof data.title === "string" && data.title.trim())
            ? data.title.trim().slice(0,80)
            : "Imported Chat";
          chat.messages = messages;

          chats.unshift(chat);
          currentChat = chat;
          saveChats();
          closeModal();
          render();
          toast("Chat imported.");
        }catch(error){
          toast("That file is not valid JSON.");
        }
      };

      reader.onerror = function(){
        toast("Could not read the file.");
      };

      reader.readAsText(file);
    });

    $("#exportJsonButton").addEventListener("click", function(){
      ensureChat();

      const payload = {
        title: currentChat.title,
        created: currentChat.created,
        messages: cleanMessages(currentChat.messages)
      };

      const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");

      a.href = url;
      a.download = "simple-chat-ai.json";
      a.click();

      URL.revokeObjectURL(url);
      toast("Chat exported as JSON.");
    });
  }

  /* ---------- 4. WORD COUNT ---------- */
  function countWords(text){
    const match = String(text).trim().match(/\S+/g);
    return match ? match.length : 0;
  }

  function wordCount(){
    const messages = currentChat ? currentChat.messages : [];

    let userWords = 0;
    let aiWords = 0;
    let characters = 0;

    messages.forEach(m => {
      const words = countWords(m.content);
      characters += String(m.content).length;

      if(m.role === "user"){
        userWords += words;
      }else{
        aiWords += words;
      }
    });

    const total = userWords + aiWords;
    const minutes = total ? Math.max(1, Math.ceil(total / 200)) : 0;

    openModal("🔢 Word Count", `
      <div class="logic-answer" style="margin-top:0">Messages: ${messages.length}
Your words: ${userWords}
AI words: ${aiWords}
Total words: ${total}
Characters: ${characters}
Estimated reading time: ${minutes} min</div>
    `);
  }

  /* ---------- 5. ACCENT COLOR ---------- */
  const DEFAULT_ACCENT = ["#2563eb", "#7c3aed"];

  const PRESETS = [
    { name:"Blue",   a:"#2563eb", b:"#7c3aed" },
    { name:"Green",  a:"#16a34a", b:"#0d9488" },
    { name:"Orange", a:"#ea580c", b:"#db2777" },
    { name:"Pink",   a:"#db2777", b:"#9333ea" },
    { name:"Teal",   a:"#0891b2", b:"#2563eb" },
    { name:"Red",    a:"#dc2626", b:"#ea580c" }
  ];

  function applyAccent(a, b){
    document.documentElement.style.setProperty("--accent", a);
    document.documentElement.style.setProperty("--accent2", b);
  }

  function saveAccent(a, b){
    localStorage.setItem("simple_chat_accent", JSON.stringify([a, b]));
  }

  function loadAccent(){
    try{
      const saved = JSON.parse(localStorage.getItem("simple_chat_accent") || "null");
      if(Array.isArray(saved) && saved.length === 2){
        applyAccent(saved[0], saved[1]);
      }
    }catch(error){
      /* ignore bad saved value */
    }
  }

  function accentColor(){
    openModal("🎨 Accent Color", `
      <div class="option-grid">
        ${PRESETS.map((p, i) => `
          <button class="option" data-preset="${i}" style="padding:14px">
            <div style="height:26px;border-radius:9px;background:linear-gradient(135deg,${p.a},${p.b})"></div>
            <strong style="margin-top:8px">${p.name}</strong>
          </button>
        `).join("")}
      </div>
      <div class="form-group" style="margin-top:16px">
        <label>Custom color</label>
        <input type="color" id="accentCustom" class="form-control" style="height:44px;padding:4px"
          value="${(getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || DEFAULT_ACCENT[0])}">
      </div>
      <button class="primary" id="accentReset">Reset to Default</button>
    `);

    $$("[data-preset]").forEach(button => {
      button.addEventListener("click", function(){
        const p = PRESETS[parseInt(this.dataset.preset, 10)];
        applyAccent(p.a, p.b);
        saveAccent(p.a, p.b);
        toast(p.name + " accent applied.");
      });
    });

    $("#accentCustom").addEventListener("input", function(){
      applyAccent(this.value, this.value);
      saveAccent(this.value, this.value);
    });

    $("#accentReset").addEventListener("click", function(){
      applyAccent(DEFAULT_ACCENT[0], DEFAULT_ACCENT[1]);
      localStorage.removeItem("simple_chat_accent");
      toast("Accent color reset.");
    });
  }

  loadAccent();

  /* ---------- ADD BUTTONS TO LEFT SIDEBAR ---------- */
  const grid = document.querySelector(".feature-grid");

  [
    { icon:"📋", name:"Copy Answer",  run:copyLastAnswer },
    { icon:"🔁", name:"Regenerate",   run:regenerateAnswer },
    { icon:"📥", name:"Import / JSON", run:importExport },
    { icon:"🔢", name:"Word Count",   run:wordCount },
    { icon:"🌈", name:"Accent Color", run:accentColor }
  ].forEach(item => {
    const button = document.createElement("button");
    button.className = "feature";
    button.innerHTML =
      '<span class="feature-icon">' + item.icon + '</span>' +
      '<span class="feature-name">' + item.name + '</span>';
    button.addEventListener("click", item.run);
    grid.appendChild(button);
  });

})();
</script>

      font-size:10px;
      font-weight:700;
      white-space:nowrap;
    }
    .ai-tool.limit-locked{
      filter:brightness(.72);
      cursor:not-allowed;
    }
    .ai-tool.limit-locked:hover{
      transform:none;
      box-shadow:none;
      border-color:var(--border);
      background:var(--surface2);
    }
    .ai-tool.limit-locked .limit-badge{
      color:var(--danger);
      border-color:var(--danger);
    }
  `;
  document.head.appendChild(style);

  /* ---------- saved usage ---------- */
  let state = {};

  try{
    state = JSON.parse(localStorage.getItem(KEY) || "{}") || {};
  }catch(error){
    state = {};
  }

  function save(){
    try{
      localStorage.setItem(KEY, JSON.stringify(state));
    }catch(error){
      /* storage unavailable: limits still work until reload */
    }
  }

  function entry(name){
    if(!state[name]){
      state[name] = { count:0, lockedUntil:0 };
    }
    return state[name];
  }

  function isLocked(name){
    const e = entry(name);

    if(e.lockedUntil && Date.now() < e.lockedUntil){
      return true;
    }

    if(e.lockedUntil){
      e.count = 0;
      e.lockedUntil = 0;
      save();
    }

    return false;
  }

  function formatTime(ms){
    const total = Math.ceil(ms / 1000);
    const minutes = Math.floor(total / 60);
    const seconds = total % 60;
    return minutes + ":" + String(seconds).padStart(2, "0");
  }

  /* ---------- badges + look ---------- */
  function badgeFor(button){
    let badge = button.querySelector(".limit-badge");

    if(!badge){
      badge = document.createElement("span");
      badge.className = "limit-badge";
      button.appendChild(badge);
    }

    return badge;
  }

  function refresh(button){
    const name = button.dataset.tool;
    const badge = badgeFor(button);
    const e = entry(name);

    if(isLocked(name)){
      const remaining = e.lockedUntil - Date.now();
      button.classList.add("limit-locked");
      button.setAttribute("aria-disabled", "true");
      button.title = "Limit reached. Available again in " + formatTime(remaining);
      badge.textContent = "🔒 " + formatTime(remaining);
    }else{
      button.classList.remove("limit-locked");
      button.removeAttribute("aria-disabled");
      button.title = "";
      badge.textContent = (LIMIT - e.count) + " left";
    }
  }

  function refreshAll(){
    document.querySelectorAll(".ai-tool").forEach(refresh);
  }

  /* ---------- block + count clicks (runs before the tool's own handler) ---------- */
  const list = document.querySelector(".ai-tools");

  list.addEventListener("click", function(event){
    const button = event.target.closest(".ai-tool");

    if(!button){
      return;
    }

    const name = button.dataset.tool;

    if(isLocked(name)){
      event.preventDefault();
      event.stopImmediatePropagation();

      const remaining = entry(name).lockedUntil - Date.now();
      toast(name + " is unavailable. Try again in " + formatTime(remaining) + ".");
      refresh(button);
      return;
    }

    /* Only count real uses: the tool needs some text to work on */
    const hasText = (currentChat && currentChat.messages.length) || input.value.trim();

    if(!hasText){
      return;
    }

    const e = entry(name);
    e.count += 1;

    if(e.count >= LIMIT){
      e.lockedUntil = Date.now() + LOCK_MS;

      setTimeout(function(){
        toast(name + " limit reached (" + LIMIT + " uses). Unavailable for 5 minutes.");
      }, 80);
    }

    save();
    refresh(button);
  }, true);

  /* ---------- live countdown ---------- */
  refreshAll();
  setInterval(refreshAll, 1000);

})();
</script>

/* ==========================================================
   MODEL SELECTOR (added separately, existing code untouched)
   Simple 1.2       -> short, simple answers (default)
   Simple Fast 1.3  -> a little more detailed answers
   Simple Extra 1.4 -> very detailed, longer, fully explained answers
========================================================== */
(function(){

  const MODELS = [
    {
      id:"simple-1.2",
      name:"Simple 1.2",
      short:"1.2",
      desc:"Short and simple answers",
      prompt:
        "RESPONSE STYLE (model: Simple 1.2): Give short, simple, direct answers. " +
        "Use plain words and keep it to a few sentences unless the user asks for more. " +

      prompt:
        "RESPONSE STYLE (model: Simple Fast 1.3): Give clear, moderately detailed answers. " +
        "Explain the key points with a short example when it helps, in about 2 to 4 short paragraphs " +
        "or a compact list. Be more helpful and informative than a one-line reply, but stay focused."
    },
    {
      id:"simple-extra-1.4",
      name:"Simple Extra 1.4",
      short:"Extra 1.4",

      prompt:
        "RESPONSE STYLE (model: Simple Extra 1.4): Give thorough, in-depth, well-organized answers. " +
        "Explain the topic fully with background, step-by-step reasoning, concrete examples, " +
        "important details, edge cases or tips, and finish with a brief summary. " +
        "Use headings or lists when they make a long answer easier to read."
    }
  ];

  const KEY = "simple_chat_model";

  function findModel(id){
    return MODELS.find(m => m.id === id) || MODELS[0];
  }

  /* Default is Simple 1.2 the first time the app is opened */
  let selected = findModel(localStorage.getItem(KEY));

      transition:opacity .18s ease,transform .18s ease,visibility .18s;
    }
    .model-picker.open .model-menu{
      opacity:1;

      padding:8px 12px 6px;

      text-align:left;
      cursor:pointer;

      background:var(--surface2);

    .model-option.active{
      background:rgba(37,99,235,.10);
    }
    .model-option-text{
      flex:1;
      min-width:0;

    .model-option strong{
      display:block;

      display:block;

  `;
  document.head.appendChild(style);

  /* ---------- build the picker next to the + button ---------- */
  const picker = document.createElement("div");
  picker.className = "model-picker";

  const button = document.createElement("button");
  button.type = "button";
  button.className = "model-button";
  button.title = "Choose AI model";
  button.setAttribute("aria-haspopup", "listbox");
  button.setAttribute("aria-expanded", "false");

  const menu = document.createElement("div");
  menu.className = "model-menu";
  menu.setAttribute("role", "listbox");

  picker.appendChild(button);
  picker.appendChild(menu);

  const plus = document.getElementById("plusButton");
  plus.insertAdjacentElement("afterend", picker);

  function renderButton(){
    button.innerHTML =
      '<span>✦</span>' +
      '<span class="model-full"></span>' +

      '<span class="model-caret">▼</span>';

    button.querySelector(".model-full").textContent = selected.name;

  function renderMenu(){

    MODELS.forEach(model => {
      const option = document.createElement("button");
      option.type = "button";
      option.className = "model-option" + (model.id === selected.id ? " active" : "");
      option.setAttribute("role", "option");
      option.setAttribute("aria-selected", model.id === selected.id ? "true" : "false");

      text.className = "model-option-text";

      const title = document.createElement("strong");
      title.textContent = model.name;

      const small = document.createElement("small");
      small.textContent = model.desc;

      text.appendChild(title);
      text.appendChild(small);

      const check = document.createElement("span");
      check.className = "model-check";
      check.textContent = model.id === selected.id ? "✓" : "";

      option.appendChild(check);

      option.addEventListener("click", function(event){

      });

    renderMenu();

      closeMenu();
    }else{
      openMenu();
    }
  });

  document.addEventListener("click", function(event){
    if(!picker.contains(event.target)){
      closeMenu();
    }
  });

  document.addEventListener("keydown", function(event){
    if(event.key === "Escape"){
      closeMenu();
    }
  });

  renderButton();
  renderMenu();

  /* ---------- make the selected model change the AI answers ----------
     Wraps fetch so every chat request carries the selected model's
     response-style instructions. The original chat code is not edited. */
  const originalFetch = window.fetch.bind(window);

  window.fetch = function(resource, options){
    try{
      const url = typeof resource === "string" ? resource : ((resource && resource.url) || "");

      if(url.indexOf("/netlify/functions/chat") !== -1 && options && typeof options.body === "string"){
        const body = JSON.parse(options.body);

        body.systemPrompt = (body.systemPrompt || "") + "\n\n" + selected.prompt;
        body.model = selected.id;

        options = Object.assign({}, options, { body: JSON.stringify(body) });
      }
    }catch(error){
      /* if anything goes wrong, send the request unchanged */
    }

    return originalFetch(resource, options);
  };

})();

<script>
"use strict";

/* ==========================================================
   SIMPLE EXTRA 1.4 WAIT TIME (added separately, existing code untouched)
   - Clicking Simple Extra 1.4 starts a 6 minute wait
   - It says when the model will be available, with a live countdown
   - After 6 minutes it becomes available and stays available
========================================================== */
(function(){

  const EXTRA_NAME = "Simple Extra 1.4";
  const EXTRA_ID = "simple-extra-1.4";
  const EXTRA_DESC = "Very detailed, longer explanations";
  const WAIT_MS = 6 * 60 * 1000;
  const KEY = "simple_chat_extra_unlock";
  const MODEL_KEY = "simple_chat_model";

  const menu = document.querySelector(".model-menu");

  if(!menu){
    return;
  }

  /* ---------- styles ---------- */
  const style = document.createElement("style");
  style.textContent = `
    .model-option.extra-locked{
      filter:brightness(.75);
      cursor:not-allowed;
    }
    .model-option.extra-locked:hover{
      background:transparent;
    }
  `;
  document.head.appendChild(style);

  /* ---------- saved state ---------- */
  let state = { startedAt:null, unlocked:false };

  try{
    const saved = JSON.parse(localStorage.getItem(KEY) || "null");
    if(saved && typeof saved === "object"){
      state.startedAt = typeof saved.startedAt === "number" ? saved.startedAt : null;
      state.unlocked = saved.unlocked === true;
    }
  }catch(error){
    /* ignore bad saved value */
  }

  function save(){
    try{
      localStorage.setItem(KEY, JSON.stringify(state));
    }catch(error){
      /* storage unavailable: wait still works until reload */
    }
  }

  function isUnlocked(){
    if(state.unlocked){
      return true;
    }

    if(state.startedAt && Date.now() >= state.startedAt + WAIT_MS){
      state.unlocked = true;
      save();
      return true;
    }

    return false;
  }

  function formatTime(ms){
    const total = Math.max(0, Math.ceil(ms / 1000));
    const minutes = Math.floor(total / 60);
    const seconds = total % 60;
    return minutes + ":" + String(seconds).padStart(2, "0");
  }

  function remaining(){
    return state.startedAt + WAIT_MS - Date.now();
  }

  /* ---------- find the Simple Extra option ---------- */
  function isExtraOption(option){
    const title = option.querySelector("strong");
    return !!title && title.textContent === EXTRA_NAME;
  }

  function extraOption(){
    return Array.from(menu.querySelectorAll(".model-option")).find(isExtraOption) || null;
  }

  /* ---------- look of the option ---------- */
  function refresh(){
    const option = extraOption();

    if(!option){
      return;
    }

    const small = option.querySelector("small");
    const check = option.querySelector(".model-check");

    if(isUnlocked()){
      option.classList.remove("extra-locked");
      option.removeAttribute("aria-disabled");

      if(small && small.textContent !== EXTRA_DESC){
        small.textContent = EXTRA_DESC;
      }

      if(check && check.textContent === "🔒"){
        check.textContent = "";
      }

      return;
    }

    option.classList.add("extra-locked");
    option.setAttribute("aria-disabled", "true");

    const text = state.startedAt
      ? "Available in " + formatTime(remaining())
      : "Available after 6 minutes";

    if(small && small.textContent !== text){
      small.textContent = text;
    }

    if(check && check.textContent !== "🔒"){
      check.textContent = "🔒";
    }
  }

  /* The model menu is rebuilt after every selection, so restyle it each time */
  new MutationObserver(refresh).observe(menu, { childList:true });

  /* ---------- block Simple Extra until the wait is over ---------- */
  menu.addEventListener("click", function(event){
    const option = event.target.closest(".model-option");

    if(!option || !isExtraOption(option)){
      return;
    }

    if(isUnlocked()){
      return;
    }

    event.preventDefault();
    event.stopImmediatePropagation();

    if(!state.startedAt){
      state.startedAt = Date.now();
      save();
      toast(EXTRA_NAME + " will be available after 6 minutes.");
    }else{
      toast(EXTRA_NAME + " will be available in " + formatTime(remaining()) + ".");
    }

    refresh();
  }, true);

  /* ---------- live countdown ---------- */
  setInterval(function(){
    const wasUnlocked = state.unlocked;
    refresh();

    if(!wasUnlocked && state.unlocked && state.startedAt){
      toast(EXTRA_NAME + " is now available.");
    }
  }, 1000);

  /* If Simple Extra was saved as the model before the wait existed, go back to Simple 1.2 */
  if(localStorage.getItem(MODEL_KEY) === EXTRA_ID && !isUnlocked()){
    const first = menu.querySelector(".model-option");

    if(first){
      first.click();
    }
  }

  refresh();

})();
</script>
<script>
"use strict";

/* ==========================================================
   STOP GENERATING (added separately, existing code untouched)
   - A stop button appears in the header while the AI is answering
   - Pressing it cancels the request and adds "Generation stopped."
========================================================== */
(function(){

  const CHAT_URL = "/netlify/functions/chat";

  /* ---------- styles ---------- */
  const style = document.createElement("style");
  style.textContent = `
    .stop-button{
      display:none;
      place-items:center;
      color:var(--danger);
      border-color:var(--danger);
      animation:stopPulse 1.2s ease-in-out infinite;
    }
    .stop-button.show{
      display:grid;
    }
    .stop-button:hover{
      border-color:var(--danger);
      box-shadow:0 0 0 3px rgba(239,68,68,.18);
    }
    @keyframes stopPulse{
      0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.35);}
      50%{box-shadow:0 0 0 6px rgba(239,68,68,0);}
    }
  `;
  document.head.appendChild(style);

  /* ---------- header button ---------- */
  const stopButton = document.createElement("button");
  stopButton.type = "button";
  stopButton.className = "header-button stop-button";
  stopButton.id = "stopButton";
  stopButton.title = "Stop generating";
  stopButton.setAttribute("aria-label", "Stop generating");
  stopButton.textContent = "⏹️";

  document.getElementById("themeButton").insertAdjacentElement("beforebegin", stopButton);

  /* ---------- track running requests ---------- */
  const running = new Set();

  function updateButton(){
    stopButton.classList.toggle("show", running.size > 0);
  }

  stopButton.addEventListener("click", function(){
    if(!running.size){
      return;
    }

    running.forEach(controller => controller.abort());
    toast("Stopping...");
  });

  /* ---------- wrap fetch so chat requests can be cancelled ----------
     The whole response body is read inside the wrapper, so a stop at any
     point is handled here and the original chat code is not edited. */
  const previousFetch = window.fetch.bind(window);

  window.fetch = function(resource, options){
    const url = typeof resource === "string" ? resource : ((resource && resource.url) || "");

    if(url.indexOf(CHAT_URL) === -1){
      return previousFetch(resource, options);
    }

    const controller = new AbortController();
    running.add(controller);
    updateButton();

    const settings = Object.assign({}, options, { signal:controller.signal });

    return previousFetch(resource, settings)
      .then(function(response){
        return response.text().then(function(text){
          return new Response(text, {
            status: response.status,
            statusText: response.statusText,
            headers: { "Content-Type":"application/json" }
          });
        });
      })
      .catch(function(error){
        if(error && error.name === "AbortError"){
          return new Response(JSON.stringify({ reply:"⏹️ Generation stopped." }), {
            status: 200,
            headers: { "Content-Type":"application/json" }
          });
        }

        throw error;
      })
      .finally(function(){
        running.delete(controller);
        updateButton();
      });
  };

})();
</script>

    /* ---------- STATUS ---------- */

    /* ---------- AUTO READ ---------- */

    .auto-read-indicator{

    /* ---------- SHORTCUT MODAL ---------- */

    }

      padding:4px 8px;
      border:1px solid var(--border);
